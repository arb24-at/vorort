id: legal-notice-en
kind: legal-notice
locale: en
publication: draft
seo:
  title: Legal Notice | Operator Details — Working Draft
  description: >-
    English working draft of the legal notice. Verified operator, address and contact details are
    still required. The German legal notice remains the authoritative version.
header:
  eyebrow: Legal information · Working draft
  title: Legal notice
  intro: >-
    This draft sets out the information that must be confirmed for the website operator. It is
    incomplete and is not yet a publication-ready legal notice. The German version is the
    authoritative legal source.
sections:
  - id: operator
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      title: Website operator
      blocks:
        - type: prose
          paragraphs:
            - >-
              [Required: the operator’s full legal name and complete establishment address
              suitable for publication.]
            - >-
              The operator’s identity and any additional registered business name will be added
              only after confirmation.
  - id: contact-details
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      title: Direct contact
      blocks:
        - type: prose
          paragraphs:
            - "[Required: an operative email address and confirmed means of direct communication.]"
            - >-
              The centrally configured demonstration phone number, address and email must not be
              treated as the operator’s verified contact details.
  - id: applicable-identifiers
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      title: Registration and identification details
      blocks:
        - type: prose
          paragraphs:
            - >-
              [Confirm whether there is a commercial or other relevant register entry, and supply
              the register and number if applicable.]
            - >-
              [Confirm any assigned VAT identification number or business identification number.
              Do not insert a private tax number.]
            - >-
              Any legal-form, representative, licensing or regulated-profession information should
              be included only when applicable to the actual operator and activity.
  - id: consumer-disputes
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      title: Consumer dispute resolution
      blocks:
        - type: prose
          paragraphs:
            - >-
              [Confirm whether the business is willing or obliged to participate in proceedings
              before a consumer conciliation body, and whether the information duties apply.
              Supply the actual body and details where required.]
            - >-
              No participation decision has been supplied. This draft therefore makes no claim
              that the operator participates, refuses participation or is exempt.
  - id: editorial-responsibility
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      title: Additional responsibility information
      blocks:
        - type: prose
          paragraphs:
            - >-
              [Confirm whether the actual website contains journalistic/editorial material
              requiring an additional named person under section 18(2) of the German Interstate
              Media Treaty.]
            - >-
              This conditional requirement should not be filled with an invented name or
              automatically treated as applicable to ordinary service descriptions.
draftNotice:
  title: Operator information is still missing
  body: >-
    The example identity, address and contact details used elsewhere in the website are not
    verified legal details and are deliberately not repeated here.
missingFacts:
  - Full legal operator name and establishment address suitable for publication.
  - Verified operative email address and direct contact details.
  - Applicable legal-form, register and assigned tax/business identification details.
  - >-
    Consumer conciliation participation, obligations and any applicable editorial-responsibility
    information.
references:
  - label: Section 5 DDG — provider information (German)
    href: https://www.gesetze-im-internet.de/ddg/__5.html
  - label: Section 36 VSBG — consumer dispute information (German)
    href: https://www.gesetze-im-internet.de/vsbg/__36.html
  - label: Section 18 MStV — Berlin legal source (German)
    href: >-
      https://gesetze.berlin.de/bsbe/?query=DOKNR%3Ajlr-NNLBE00004926NN00000000043&source=PermaLink
