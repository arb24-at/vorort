        - "IT-Erfahrung seit 2008"
        - "Windows-Arbeitsplätze und Microsoft-365-Anwendungen"
        - "E-Mail-, Domain- und Kontozusammenhänge"
        - "Netzwerk- und Arbeitsplatz-IT im kleinen Unternehmen"
    boundaries:
      eyebrow: "Klare Grenzen"
      title: "Verantwortbar statt pauschal versprochen"
      items:
        - "Komplexe Migrationen werden vor einer Zusage nach Ausgangssystem, Daten, Benutzern, Domains und Abhängigkeiten geprüft."
        - "Passwörter, Authentifizierungs- und Wiederherstellungscodes gehören nicht in Kontaktformular oder ungeschützte E-Mail."
        - "Umfangreiche Compliance-, Governance-, Hochsicherheits- oder Enterprise-Security-Projekte werden gesondert auf passende Spezialisierung geprüft."
        - "Eine störungsfreie Umstellung oder bestimmte Reaktionszeit wird nicht pauschal garantiert."
    faqs:
      - question: "Unterstützen Sie auch eine bestehende Microsoft-365-Umgebung?"
        answer: "Ja. Viele Anfragen betreffen keine Neueinführung. Wir können einzelne Probleme untersuchen, neue Benutzer oder Arbeitsplätze einrichten oder bestehende Strukturen im vereinbarten Umfang überprüfen."
      - question: "Können Sie neue Mitarbeiter und Computer vollständig einrichten?"
        answer: "Wir können Benutzerkonto, vorhandene Lizenz, Microsoft-365-Anwendungen, E-Mail, benötigte Zugriffe und den Windows-Arbeitsplatz gemeinsam betrachten. Welche Komponenten benötigt werden, hängt von Ihrer vorhandenen Umgebung ab."
      - question: "Helfen Sie bei Outlook- und E-Mail-Problemen?"
        answer: "Ja. Dazu können Anmeldung, Synchronisierung, Outlook-Profile, Microsoft-365-Postfächer, gemeinsam genutzte Postfächer und die Verbindung zwischen Arbeitsplatz und E-Mail-Dienst gehören."
      - question: "Unterstützen Sie auch OneDrive, SharePoint und Teams?"
        answer: "Ja. Wir helfen bei Synchronisierung, Dateiablagen, Freigaben, Mitgliedschaften und grundlegenden Berechtigungsstrukturen. Größere Governance- oder Enterprise-Projekte werden vorher auf ihren Umfang geprüft."
      - question: "Können E-Mails und Dateien zu Microsoft 365 migriert werden?"
        answer: "Das kann je nach Ausgangssystem möglich sein. Vor einer Zusage prüfen wir Benutzer, Daten, Postfächer, Domains, Berechtigungen und weitere Abhängigkeiten und legen anschließend den verantwortbaren Umfang fest."
      - question: "Bieten Sie auch Office-365-Support an?"
        answer: "Viele Unternehmen verwenden den Namen Office 365 weiterhin. Entscheidend ist, welche geschäftlichen Microsoft-Dienste und Abonnements tatsächlich eingesetzt werden; anhand dieser Umgebung klären wir die passende Unterstützung."
      - question: "Unterstützen Sie Microsoft 365 nur vor Ort?"
        answer: "Vor-Ort-Service in Berlin ist unser primäres Modell, besonders wenn Geräte und Arbeitsplatz Teil des Problems sind. Bestimmte Microsoft-365-Aufgaben oder eine erste Diagnose können auch remote sinnvoll sein."
      - question: "Muss ich einen langfristigen Betreuungsvertrag abschließen?"
        answer: "Nein. Einzelne Probleme, Einrichtungen und Projekte sind ein normaler Teil unseres Angebots. Wenn danach wiederkehrende Unterstützung sinnvoll ist, kann sie separat besprochen werden."
    relatedServiceIds:
      - network-it-support
      - google-workspace-cloud

