hero:
  eyebrow: "PC- & Mac-Hilfe · Vor Ort in Berlin"
  title: "PC-Hilfe für Windows und Mac in Berlin"
  intro: "Ihr Computer startet nicht, ist plötzlich langsam oder bleibt bei der Anmeldung hängen? Wir unterstützen Sie vor Ort in Berlin bei Windows- und macOS-Problemen. Wir prüfen zuerst das Fehlerbild, besprechen mögliche Schritte und berücksichtigen wichtige persönliche Daten, bevor wir etwas verändern."
problems:
  eyebrow: "Situation wiedererkennen"
  title: "Typische Computerprobleme, bei denen wir helfen"
  intro: "Sie müssen die Ursache nicht kennen. Beschreiben Sie einfach, was das Gerät macht oder seit wann sich etwas verändert hat."
  items:
    - "Der Windows-PC, Laptop oder Mac startet nicht mehr richtig oder bleibt beim Start hängen"
    - "Der Computer ist sehr langsam geworden, friert ein oder reagiert immer wieder verzögert"
    - "Windows oder macOS zeigt Fehler nach Updates, startet neu oder Programme funktionieren plötzlich nicht mehr"
    - "Pop-ups, Schadsoftware oder verdächtiges Verhalten machen das Gerät oder ein Konto unsicher"
    - "Das Windows-, Mac- oder Online-Konto lässt sich mit den verfügbaren Zugangsdaten nicht mehr normal öffnen"
    - "BitLocker fordert beim Start einen Wiederherstellungsschlüssel an oder der richtige Schlüssel ist unklar"
    - "Einzelne Programme, Drucker oder angeschlossene Geräte funktionieren im Zusammenhang mit dem Computerproblem nicht richtig"
included:
  eyebrow: "Mögliche Unterstützung"
  title: "Was wir prüfen und wieder in Ordnung bringen"
  intro: "Der konkrete Weg hängt vom Fehlerbild ab. Wir arbeiten vom Symptom zur Ursache und vermeiden unnötige Eingriffe."
  items:
    - "Strukturierte Prüfung von Windows- und macOS-Systemproblemen, Softwarefehlern und Startproblemen"
    - "Systemreparatur, sinnvolle Bereinigung, Update-Fehlerbehebung oder Neuinstallation von Windows beziehungsweise macOS"
    - "Entfernung von Schadsoftware und Bereinigung auffälliger Software- oder Browserzustände"
    - "Legitime Wiederherstellung von Windows- oder Mac-Anmeldung sowie Microsoft- oder Apple-Account-Zugang, soweit die vorgesehenen Wege verfügbar sind"
    - "Hilfe beim Auffinden und Verwenden eines vorhandenen BitLocker-Wiederherstellungsschlüssels ohne Umgehung der Verschlüsselung"
    - "Sicherung lesbarer persönlicher Daten vor riskanten Reparatur- oder Neuinstallationsschritten, wenn dies sinnvoll und möglich ist"
    - "Mitnahme und Rückgabe des Computers nach Absprache, wenn eine längere Diagnose oder Wiederherstellung vor Ort unpraktisch wäre"
    - "Klare Empfehlung für einen Gerätewechsel mit Verweis auf Kaufberatung, Einrichtung und Datenumzug, wenn weiteres Reparieren nicht sinnvoll ist"
outcome:
  eyebrow: "Ein brauchbares Ergebnis"
  title: "Wieder arbeiten können und wissen, was passiert ist"
  text: "Ziel ist ein verlässlich nutzbares Gerät oder zumindest eine klare, verantwortbare Entscheidung über den nächsten Schritt. Sie erfahren, was die Ursache wahrscheinlich war, was wir geändert haben und ob weitere Arbeit, ein Spezialist oder ein Gerätewechsel sinnvoller ist."
cta:
  title: "Computerproblem schildern"
  text: "Nennen Sie Gerät, sichtbares Symptom und – falls bekannt – die letzte Änderung. Wir ordnen ein, ob ein Vor-Ort-Termin, weitere Prüfung oder ein anderer Weg sinnvoll ist."
  prompt: "Bitte senden Sie keine Passwörter, PINs, BitLocker-Schlüssel, Bestätigungscodes oder andere Zugangsdaten über das Anfrageformular."
