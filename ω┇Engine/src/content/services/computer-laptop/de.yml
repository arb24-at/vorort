hero:
  eyebrow: "Privatkunden · Computerhilfe"
  title: "Computer- und Laptop-Hilfe in Berlin"
  intro: "Wenn ein Computer langsam wird, nicht mehr startet oder ständig Fehlermeldungen zeigt, grenzen wir die Ursache strukturiert ein. Wir helfen bei Windows-PCs und Laptops, erklären die notwendigen Schritte verständlich und prüfen die Funktionen gemeinsam mit Ihnen."
problems:
  eyebrow: "Situation wiedererkennen"
