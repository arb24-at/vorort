seo:
  title: "PC-Hilfe Berlin | Computer, Laptop & Mac"
  description: "PC-Hilfe vor Ort in Berlin für Windows und Mac: Unterstützung bei Startproblemen, langsamen Computern, Abstürzen, Schadsoftware und gesperrtem Zugang."
