        title: "PC-Hilfe für Windows und Mac in Berlin"
        intro: "Ihr Computer startet nicht, ist plötzlich langsam oder bleibt bei der Anmeldung hängen? Wir unterstützen Sie vor Ort in Berlin bei Windows- und macOS-Problemen. Wir prüfen zuerst das Fehlerbild, besprechen mögliche Schritte und berücksichtigen wichtige persönliche Daten, bevor wir etwas verändern."
