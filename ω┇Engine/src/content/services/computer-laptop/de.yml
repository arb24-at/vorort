  title: "So kann die Hilfe aussehen"
  items:
    - "Erstdiagnose und verständliche Einschätzung der nächsten Schritte"
    - "Systembereinigung, Updates und sinnvolle Grundeinstellungen"
    - "Einrichtung von Programmen, Benutzerkonten und Peripherie"
    - "Abschlusskontrolle mit Hinweisen für den sicheren Alltag"
outcome:
  eyebrow: "Ein brauchbares Ergebnis"
  title: "Pragmatisch statt rätselhaft"
  text: "Sie erhalten eine nachvollziehbare Lösung und wissen anschließend, was geändert wurde. Wenn ein Austausch oder eine Spezialreparatur wirtschaftlicher ist, sprechen wir das offen an, bevor unnötige Arbeit entsteht."
cta:
  title: "Computerproblem schildern"
