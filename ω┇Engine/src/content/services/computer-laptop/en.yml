  eyebrow: "Windows & Mac · On site in Berlin"
  title: "Computer support in Berlin"
  intro: "On-site help for Windows PCs, laptops and Macs. If your computer will not start, keeps freezing or will not let you sign in, we check the problem and explain the options. You can ask about one fault; there is no need to know what caused it."
