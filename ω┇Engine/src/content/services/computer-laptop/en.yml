  eyebrow: "Testing and handover"
  title: "Understand what changed and what comes next"
  text: "We check the agreed functions with you and explain the changes. If a system fix is not a sensible option, we make the limits clear and discuss specialist physical repair or replacement instead of continuing without a plan."
