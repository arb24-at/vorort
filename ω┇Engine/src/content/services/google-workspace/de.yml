    description: "E-Mail, gemeinsame Dateien, Benutzerkonten, Geräte, Sicherheit und Backup werden im Zusammenhang mit dem tatsächlichen Arbeitsablauf betrachtet."
  storyboard:
    - role: situation
      composition: wide
      visualState: conflict
      eyebrow: "Arbeitsalltag"
      title: "Wenn Google Workspace eingerichtet werden soll oder im Alltag nicht sauber funktioniert"
      text: "Anfragen reichen von einer neuen geschäftlichen Gmail- und Drive-Umgebung bis zu gewachsenen Freigaben, Nutzerwechseln oder Störungen, bei denen E-Mail, Dateien und Zugriffe nicht mehr zuverlässig zusammenspielen."
      points:
        - "Eine neue Workspace-Umgebung soll mit Domain, Nutzern und gemeinsamen Daten eingerichtet werden"
