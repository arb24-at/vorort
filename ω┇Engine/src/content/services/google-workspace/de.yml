expanded:
  situations:
    eyebrow: "Konkrete Aufgaben"
    title: "Typische Google-Workspace-Projekte im kleinen Unternehmen"
    intro: "Die folgenden Situationen zeigen, wo Unterstützung häufig sinnvoll ist. Sie sind keine starre Leistungsliste; vorhandene Systeme, Daten und gewünschtes Ergebnis bestimmen den verantwortbaren Umfang."
    items:
      - title: "Neue Workspace-Einführung"
        text: "Wir können beim passenden Tarif, der Einrichtung der Unternehmensumgebung, Domainbestätigung, Benutzern, Gmail und grundlegenden Freigabe- und Sicherheitseinstellungen unterstützen."
      - title: "Gmail & geschäftliche Domain"
        text: "Eigene E-Mail-Adressen, notwendige DNS-Einträge, Aliasse, Gruppen und konkrete Zustellungs- oder Konfigurationsprobleme werden im Zusammenhang mit der vorhandenen Domain geprüft."
      - title: "Shared Drives & Freigaben"
        text: "Gemeinsame Daten lassen sich über Shared Drives, Gruppen und passende Zugriffsrechte klarer organisieren. Wir helfen beim Aufbau oder bei der Bereinigung einer bereits gewachsenen Struktur."
      - title: "Benutzerwechsel & Sicherheit"
        text: "Neue oder ausscheidende Mitarbeiter, Gruppen, Administratorrollen, 2-Schritt-Verifizierung und Wiederherstellungsoptionen werden passend zum vereinbarten Umfang eingerichtet oder überprüft."
      - title: "Migration & Mischumgebungen"
        text: "E-Mail, Dateien und Benutzer können je nach Ausgangssystem zu Google Workspace, aus Google Workspace oder zwischen Google- und Microsoft-Umgebungen migriert werden. Vor der Zusage prüfen wir Daten, Rechte, Domains und technische Abhängigkeiten."
      - title: "Backup & Geräteintegration"
        text: "Drive for desktop, Windows- und Mac-Arbeitsplätze sowie eine zusätzliche, von Workspace getrennte Sicherung können dort eingerichtet werden, wo sie für den Betrieb sinnvoll sind."
  process:
    eyebrow: "Vorgehen"
    title: "So gehen wir bei Google-Workspace-Anfragen vor"
    intro: "Wir beginnen mit dem betrieblichen Ziel und der vorhandenen Umgebung. Produktive Änderungen an Domains, E-Mail, gemeinsamen Daten oder Benutzerzugriffen werden vor der Umsetzung abgestimmt."
    steps:
      - title: "Ausgangslage klären"
        text: "Wir erfassen Nutzerzahl, Domain, verwendete Google-Dienste, vorhandene E-Mail- oder Microsoft-Umgebung und das konkrete Ziel oder Problem."
      - title: "Ziel & Umfang festlegen"
        text: "Bei Neueinrichtung oder Plattformwahl klären wir, welche Dienste tatsächlich gebraucht werden. Bei Störungen grenzen wir die betroffenen Konten, Geräte und Datenbereiche ein."
      - title: "Domain, Daten & Zugriffe vorbereiten"
        text: "Vor produktiven Änderungen prüfen wir notwendige DNS-Einstellungen, Benutzer, Gruppen, Freigaben, Sicherheitsoptionen und bei Migrationen die Datenquellen."
      - title: "Kontrolliert umsetzen"
        text: "Einrichtung, Korrekturen oder Migration werden in abgestimmten Schritten durchgeführt. Zusätzliche Arbeiten werden nicht stillschweigend in den Umfang aufgenommen."
      - title: "Funktion & Übergabe prüfen"
        text: "Wir testen die vereinbarten Funktionen und halten wichtige Änderungen, offene Punkte oder nächste Schritte verständlich fest."
  proof:
    eyebrow: "Kompetenz im Zusammenhang"
    title: "Google Workspace endet nicht bei Gmail"
    text: "Für kleine Unternehmen liegen viele Workspace-Aufgaben zwischen Cloud-Dienst und realem Arbeitsplatz. Deshalb verbinden wir Google-Workspace-Arbeit mit Erfahrung rund um E-Mail, Domains, Windows und macOS, Microsoft 365, Netzwerke und Backup."
    items:
      - "IT-Erfahrung seit 2008"
      - "Google Workspace, Gmail, Drive und Admin-Konsole"
      - "E-Mail-, Domain- und DNS-Zusammenhänge"
      - "Windows- und Mac-Arbeitsplätze"
      - "Microsoft 365 und gemischte Cloud-Umgebungen"
      - "Backup, NAS und lokale Büro-IT im Zusammenhang"
  boundaries:
    eyebrow: "Klare Grenzen"
    title: "Praktische Business-Unterstützung statt Enterprise-Versprechen"
    items:
      - "Große Enterprise-Migrationen, DLP-, eDiscovery-, SSO-, Identitäts- oder umfassende Compliance-Projekte werden nicht als Standardleistung beworben und vor einer Zusage gesondert geprüft."
      - "Migrationsergebnisse hängen von Ausgangssystem, Daten, Berechtigungen, Konten und verfügbaren Schnittstellen ab; eine verlustfreie oder unterbrechungsfreie Migration wird nicht pauschal garantiert."
      - "Passwörter, Bestätigungscodes, Wiederherstellungsschlüssel und andere Zugangsdaten gehören nicht in Kontaktformular oder ungeschützte Nachrichten."
      - "Wir verkaufen keine eigenen Google-Workspace-Lizenzen. Bei Bedarf unterstützen wir bei Tarifauswahl und Bestellung des passenden Abonnements."
      - "Google Workspace ist nicht automatisch die richtige Plattform für jedes Unternehmen. Wenn die Wahl noch offen ist, wird der technische und organisatorische Bedarf zuerst betrachtet."
  faqs:
    - question: "Richten Sie Google Workspace für ein Unternehmen komplett neu ein?"
      answer: "Ja. Je nach Ausgangslage können Tarifauswahl, Domainbestätigung, Benutzer, Gmail, Gruppen, gemeinsame Dateiablagen, grundlegende Sicherheit und die Einrichtung der Arbeitsplätze Teil des Projekts sein."
    - question: "Helfen Sie auch bei einer bestehenden Google-Workspace-Umgebung?"
      answer: "Ja. Wir unterstützen bei konkreten Problemen, Benutzerwechseln, Gmail- oder Drive-Störungen, Freigaben, Berechtigungen und geplanten Änderungen an einer bestehenden Umgebung."
    - question: "Können Sie Gmail mit unserer eigenen Firmendomain einrichten?"
      answer: "Ja. Dazu gehören je nach Domainanbieter die Bestätigung der Domain, die erforderlichen DNS- und E-Mail-Einstellungen sowie Benutzer, Aliasse oder Gruppen."
    - question: "Unterstützen Sie Shared Drives und Berechtigungen?"
      answer: "Ja. Wir helfen bei Shared Drives, Gruppen, Mitgliedschaften, Freigaben, externen Zugriffen und einer nachvollziehbaren Ablagestruktur. Änderungen an gemeinsam genutzten Daten werden vorher auf ihre Auswirkungen geprüft."
    - question: "Können Sie von Microsoft 365 oder einem anderen E-Mail-Anbieter zu Google Workspace migrieren?"
      answer: "Das kann je nach Ausgangssystem möglich sein. Vor einer Zusage prüfen wir Postfächer, Dateien, Benutzer, Domains, Berechtigungen und weitere Abhängigkeiten und legen anschließend den verantwortbaren Migrationsumfang fest."
    - question: "Können Sie auch von Google Workspace zu Microsoft 365 migrieren?"
      answer: "Ja, wenn das Zielsystem und die Ausgangsdaten dafür geeignet sind. Auch dabei wird die Migration vorher nach Benutzern, E-Mail, Dateien, Berechtigungen und Domainabhängigkeiten geplant."
    - question: "Helfen Sie bei 2-Schritt-Verifizierung und Kontozugriff?"
      answer: "Ja. Wir können bei 2-Schritt-Verifizierung, Wiederherstellungsoptionen, grundlegenden Sicherheitseinstellungen und legitimen Kontozugriffsproblemen helfen. Eine Wiederherstellung kann nur mit den verfügbaren und berechtigten Kontomechanismen erfolgen."
    - question: "Bieten Sie ein zusätzliches Backup für Google Workspace an?"
      answer: "Ja. Wenn eine vom produktiven Workspace getrennte Sicherung gewünscht ist, können wir eine passende Backup-Lösung planen und einrichten. Welche Daten und Aufbewahrung sinnvoll sind, wird vorher abgestimmt."
    - question: "Was ist der Unterschied zum direkten Google-Workspace-Support?"
      answer: "Google bietet Administratoren eigenen Produktsupport. Unser Schwerpunkt liegt auf Ihrer konkreten Unternehmensumgebung: Domain, Benutzer, Geräte, Migration, Freigaben, Backup und dem Zusammenspiel mit vorhandener Microsoft- oder lokaler IT."
    - question: "Muss ich mich langfristig an eine laufende Workspace-Betreuung binden?"
      answer: "Nein. Eine Neueinrichtung, Migration, konkrete Änderung oder Fehlerbehebung kann als einzelnes Projekt beauftragt werden. Ein dauerhafter Administrationsvertrag ist kein Standardbestandteil dieser Leistung."
  relatedServiceIds:
