      title: "Eine Workspace-Umgebung, die im Betrieb nachvollziehbar bleibt"
      text: "Am Ende sollen Benutzer sich anmelden können, geschäftliche E-Mail funktionieren, gemeinsame Daten am richtigen Ort liegen und Zugriffe zur jeweiligen Aufgabe passen. Relevante Einstellungen und offene Punkte werden verständlich übergeben."
      points:
        - "Gmail und Domain funktionieren im vereinbarten Umfang"
        - "Benutzer, Gruppen und Zugriffe entsprechen dem vorgesehenen Arbeitsablauf"
