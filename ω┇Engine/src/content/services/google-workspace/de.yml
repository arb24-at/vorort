        - "Nutzer / Gruppen"
        - "Drive / Rechte"
        - "Geräte"
    - role: intervention
      composition: text-left
      visualState: controlled-change
      eyebrow: "Umsetzung"
      title: "Einrichtung und Migration in nachvollziehbaren Schritten"
      text: "Vor Änderungen an produktiver E-Mail, Domains, gemeinsamen Daten oder Zugriffsrechten klären wir Ziel, Abhängigkeiten und Rückfallmöglichkeiten. Neue Umgebungen und Migrationen werden entsprechend ihrer tatsächlichen Größe geplant."
      points:
        - "Workspace, Domain, Benutzer und grundlegende Sicherheitsoptionen einrichten"
        - "Gmail, Gruppen, Aliasse und gemeinsame Dateiablagen passend strukturieren"
        - "Daten und E-Mail zwischen Google Workspace, Microsoft 365 oder anderen Quellen migrieren"
        - "Zusätzliche Backup- und Geräteintegration dort einrichten, wo sie sinnvoll ist"
