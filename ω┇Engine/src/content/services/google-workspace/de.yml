    - role: investigation
      composition: system
      visualState: dependencies
      eyebrow: "Zusammenhänge"
      title: "Domain, Konten, Dateien und Geräte gemeinsam prüfen"
      text: "Ein sichtbares Workspace-Problem kann an der Domain, einem Benutzerkonto, einer Freigabe, dem Gerät oder einer Synchronisierung entstehen. Deshalb prüfen wir nur die Ebenen, die für das konkrete Anliegen tatsächlich zusammenhängen."
      points:
        - "Domain, Gmail-Einstellungen und notwendige DNS-Einträge"
        - "Benutzer, Gruppen, Administratorrollen und Wiederherstellungsoptionen"
        - "My Drive, Shared Drives, Freigaben und externe Zugriffe"
        - "Windows- oder Mac-Arbeitsplätze, Drive for desktop und Browser"
      callouts:
