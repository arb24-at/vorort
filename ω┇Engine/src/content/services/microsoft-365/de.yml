    content:
      eyebrow: Für Unternehmen · Konten, E-Mail und Zusammenarbeit
      title: Microsoft 365 Support für Unternehmen in Berlin
      intro: Wir helfen Berliner Unternehmen bei Microsoft 365 – von einem nicht funktionierenden Outlook-Postfach bis
        zur Einrichtung neuer Arbeitsplätze und geplanter Umstellungen. Dabei betrachten wir Konten, Anwendungen, Berechtigungen
        und die betroffenen Geräte zusammen, statt nur an einem einzelnen Programm zu arbeiten.
      actions:
      - label: Microsoft 365 anfragen
        target: kontakt
      - label: Leistungsbereiche ansehen
