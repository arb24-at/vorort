seo:
  title: Microsoft 365 Support Berlin | Outlook, Teams & Einrichtung
  description: 'Microsoft 365 Support für Berliner Unternehmen: Benutzer, Outlook, Teams, OneDrive, SharePoint, Berechtigungen
    und geplante Umstellungen. Vor Ort oder remote.'
  intent: Microsoft-365-Support oder Beratung für ein kleines Berliner Unternehmen mit einem konkreten Problem, einer
    Einrichtung oder einer geplanten Änderung finden.
hero:
  eyebrow: Für Unternehmen · Konten, E-Mail und Zusammenarbeit
  title: Microsoft 365 Support für Unternehmen in Berlin
  intro: Wir helfen Berliner Unternehmen bei Microsoft 365 – von einem nicht funktionierenden Outlook-Postfach bis zur
    Einrichtung neuer Arbeitsplätze und geplanter Umstellungen. Dabei betrachten wir Konten, Anwendungen, Berechtigungen
    und die betroffenen Geräte zusammen, statt nur an einem einzelnen Programm zu arbeiten.
problems:
  eyebrow: Typische Situationen
  title: Woran Microsoft-365-Probleme im Alltag sichtbar werden
  intro: Sie müssen die technische Ursache nicht vorab kennen. Entscheidend ist zunächst, was im Betrieb nicht funktioniert
    oder was sich ändern soll.
  items:
  - Ein neuer Mitarbeiter oder Windows-Arbeitsplatz soll vollständig eingerichtet werden
  - Outlook, E-Mail, Anmeldung oder Synchronisierung funktionieren nicht zuverlässig
  - Teams, OneDrive oder SharePoint zeigen unklare Dateien, Freigaben oder Zugriffe
  - Benutzerkonten, Lizenzen, Gruppen oder Berechtigungen sind nicht mehr nachvollziehbar
  - Eine bestehende Microsoft-365-Umgebung ist mit der Zeit uneinheitlich gewachsen
  - E-Mail, Dateien oder Benutzer sollen kontrolliert zu Microsoft 365 umgestellt werden
included:
  eyebrow: Mögliche Unterstützung
  title: Microsoft 365 im Zusammenhang mit dem Arbeitsplatz
  intro: Der genaue Umfang richtet sich nach der vorhandenen Umgebung und dem konkreten betrieblichen Ziel. Typische Aufgaben
    verbinden Cloud-Dienste mit Benutzern und den tatsächlichen Arbeitsplätzen.
  items:
  - Benutzerkonten, Gruppen, vorhandene Lizenzen und grundlegende Zugriffsstrukturen
  - Einrichtung von Windows-Arbeitsplätzen und Microsoft-365-Anwendungen
  - Outlook-, Exchange-Online-, Postfach- und Synchronisierungsprobleme
  - Teams-Mitgliedschaften, Zusammenarbeit und grundlegende Zugriffsprobleme
  - OneDrive- und SharePoint-Synchronisierung, Freigaben und Berechtigungen
  - Geschäftliche E-Mail-Domains und notwendige Microsoft-365-Einstellungen
  - Migrations- und Umstellungsprojekte nach Prüfung der Ausgangssituation
  - Verständliche Dokumentation oder Übergabe relevanter Änderungen
outcome:
  eyebrow: Arbeitsweise
  title: Ein funktionierender Arbeitsplatz statt einer Produktsammlung
  text: Unser Ziel ist nicht, möglichst viele Microsoft-Dienste zu aktivieren. Der richtige Benutzer soll sich anmelden
    können, E-Mail und gemeinsame Dateien sollen nachvollziehbar funktionieren, Zugriffe sollen zur Aufgabe passen und
    die Umgebung soll auch nach der Änderung verständlich bleiben.
cta:
  title: Ihr Microsoft-365-Anliegen besprechen
  text: Schildern Sie, welche Aufgabe oder Störung Ihre Mitarbeiter betrifft und wo in Berlin Sie Unterstützung benötigen.
    Das erste Gespräch ist kostenlos. Eine mögliche kostenpflichtige Diagnose vor Ort erläutern wir vor der Terminvereinbarung.
  prompt: 'Zum Beispiel: Für zwei neue Kollegen sollen Outlook, Teams und der Zugriff auf gemeinsame Dateien eingerichtet
    werden. Unser Büro ist in Berlin-Kreuzberg. Bitte keine Passwörter oder Bestätigungscodes senden.'
