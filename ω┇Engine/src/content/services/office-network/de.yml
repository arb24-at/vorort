  Business-WLAN, verwaltbarer Hardware, NAS, VPN und nachvollziehbarer Übergabe im vereinbarten Umfang.
navigation:
  group: workplace-collaboration
  label: Netzwerk & IT-Infrastruktur
page:
  template: recipe-service
  technicalDepth: professional
  theme:
    variant: network
    state: >-
      Verkabelung, Netzwerkgeräte, WLAN, Speicher und sichere Zugänge werden als gemeinsam geplante
      Büro-Infrastruktur sichtbar.
    title: Netzwerk als geplante Infrastruktur
    description: >-
      Räume, Anschlüsse, Netzwerkgeräte, WLAN und gemeinsame Dienste werden als zusammenhängende
      technische Basis des Büros betrachtet.
seo:
  title: "IT-Infrastruktur Berlin: Netzwerkverkabelung & WLAN"
  description: >-
    Büro-Netzwerk und IT-Infrastruktur in Berlin: Planung, Netzwerkverkabelung, Business-WLAN, NAS und VPN.
    Neueinrichtung und Modernisierung mit klarer Übergabe.
  intent: >-
    Einen Berliner Dienstleister für Planung, Aufbau oder Modernisierung von Büro-Netzwerk und
    IT-Infrastruktur finden, auch für einzelne Arbeiten ohne laufenden Betreuungsvertrag.
hero:
  eyebrow: Unternehmen · Vor Ort in Berlin
  title: Netzwerk & IT-Infrastruktur für Ihr Büro in Berlin
  intro: >-
    Wir planen, installieren und modernisieren Netzwerke für kleine und wachsende Unternehmen in Berlin.
    Ob zusätzliche Anschlüsse oder ein neues Büro: Wir stimmen Verkabelung, WLAN und gemeinsam genutzte
    Systeme auf Ihre Räume und die Arbeit Ihres Teams ab.
problems:
  eyebrow: Veränderungen im Büro
  title: Wenn das Firmennetzwerk Aufmerksamkeit braucht
  items:
    - Ein neues Büro benötigt Anschlüsse, WLAN und gemeinsam nutzbare Geräte
    - Zusätzliche Arbeitsplätze oder Räume passen nicht mehr zum bisherigen Netzwerk
    - Verbindungsprobleme unterbrechen Besprechungen oder den Zugriff auf gemeinsame Dateien
    - Unbeschriftete Anschlüsse und unbekannte Einstellungen erschweren Änderungen
included:
  eyebrow: Vereinbarter Leistungsumfang
  title: Planung, Installation und gezielte Unterstützung
  items:
    - Vorhandene Infrastruktur prüfen und die benötigten Verbindungen planen
    - Vereinbarte Verkabelung, Anschlüsse, Patchfelder und Netzwerkschränke installieren und prüfen
    - Verwaltbare Netzwerkhardware und Business-WLAN auswählen und konfigurieren
    - NAS-Speicher und berechtigte VPN-Zugänge passend zum Projekt einbinden
    - Vereinbarte Funktionen testen, Änderungen dokumentieren und Zugänge geordnet übergeben
outcome:
  eyebrow: Prüfung und Übergabe
  title: Ein nachvollziehbares Netzwerk als Grundlage für weitere Arbeit
  text: >-
    Die vereinbarten Verbindungen und Dienste werden vor der Übergabe geprüft. Sie erhalten praktische
    Informationen zu Geräten, Einstellungen und verbleibenden Einschränkungen, damit spätere Änderungen
    auf einer verständlichen Grundlage aufbauen können.
cta:
  title: Was benötigt Ihr Büro?
  text: >-
    Beschreiben Sie die geplante Änderung oder das Problem, Ihren Standort in Berlin und wichtige Termine.
    Das erste Gespräch ist kostenlos. Etwaige Kosten eines Diagnosebesuchs erklären wir vor der Vereinbarung.
  prompt: >-
    Zum Beispiel: Wir ziehen in ein Büro in Moabit mit acht Arbeitsplätzen und einem Besprechungsraum.
    Wir benötigen Verkabelung und WLAN und möchten unseren Switch möglichst weiterverwenden.
    Bitte keine Passwörter oder Zugangscodes angeben.
composition:
  experiment: business-network-de-preview
  relatedBefore: abschluss-kontakt
  related:
    eyebrow: Anwendungen am Arbeitsplatz
    title: Benötigen Sie auch Unterstützung bei den Diensten Ihres Teams?
