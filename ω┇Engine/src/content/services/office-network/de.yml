  sections:
    - id: einstieg
      kind: hero
      recipe: hero.service-intro
      content:
        eyebrow: Unternehmen · Vor Ort in Berlin
        title: Netzwerk & IT-Infrastruktur für Ihr Büro in Berlin
        intro: >-
          Wir planen, installieren und modernisieren Netzwerke für kleine und wachsende Unternehmen in Berlin.
          Ob zusätzliche Anschlüsse oder ein neues Büro: Wir stimmen Verkabelung, WLAN und gemeinsam genutzte
          Systeme auf Ihre Räume und die Arbeit Ihres Teams ab.
        actions:
          - label: Netzwerkprojekt besprechen
            target: kontakt
          - label: Leistungen im Detail ansehen
            target: themen
        note:
          title: Steht ein Umzug oder eine Veränderung an?
          items:
            - Ihr Standort in Berlin und die ungefähre Zahl der Arbeitsplätze
            - Was bereits vorhanden ist und was sich ändern soll
            - Einzugstermin oder Dienste, die während der Arbeit benötigt werden
          footnote: Für die erste Anfrage benötigen Sie keine technische Planung.
    - id: typische-vorhaben
      kind: recognition
      recipe: recognition.situations
      content:
        eyebrow: Wann wir helfen können
        title: Neue Räume, mehr Arbeitsplätze oder wiederkehrende Verbindungsprobleme
        intro: >-
          Ein Netzwerkprojekt kann mit einem Umzug beginnen, mit einer Störung oder mit einer kleinen
          Erweiterung, für die der bisherige Aufbau nicht mehr ausreicht.
        items:
          - title: Sie beziehen ein neues Büro
            body: >-
              Arbeitsplätze, Besprechungsräume und gemeinsame Geräte brauchen passende Anschlüsse. Eine
              Planung vor dem Ausbau hilft, ungünstige Kabelwege und fehlende Netzwerkdosen zu vermeiden.
          - title: Ihr Team braucht mehr Platz
            body: >-
              Weitere Räume oder Arbeitsplätze sind hinzugekommen, aber WLAN und Netzwerkgeräte sind noch
              auf die ursprüngliche Nutzung ausgelegt.
          - title: Verbindungen unterbrechen die Arbeit
            body: >-
              Videokonferenzen brechen ab, im Besprechungsraum ist das WLAN schwach oder gemeinsame Dateien
              sind zeitweise nicht erreichbar. Wir untersuchen, welcher Teil der Verbindung betroffen ist.
          - title: Der vorhandene Aufbau ist unübersichtlich
            body: >-
              Ein ungeordneter Netzwerkschrank, unbeschriftete Anschlüsse und nicht dokumentierte Einstellungen
              machen selbst kleine Änderungen unnötig schwierig.
    - id: praktische-unterstuetzung
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: Was wir übernehmen
        title: Ihr Firmennetzwerk planen, einrichten oder gezielt verbessern
        intro: >-
          Wir sehen uns an, was vorhanden ist, was im Büro gebraucht wird und welche Änderungen sinnvoll
          sind. Auch einige zusätzliche Anschlüsse, ein weiterer WLAN-Zugangspunkt oder ein geordneter
          Netzwerkschrank können ein eigenständiger Auftrag sein.
        blocks:
          - type: columns
            columns:
              - title: Geeignete Geräte weiterverwenden
                paragraphs:
                  - >-
                    Router, Switches und Access Points können bleiben, wenn Leistungsfähigkeit, Herstellerunterstützung
                    und Konfiguration zur Aufgabe passen. Eine empfohlene Erneuerung erklären wir. Bei Bedarf
                    beraten wir zur Auswahl oder übernehmen die vereinbarte Beschaffung.
              - title: Umfang vor der Umsetzung abstimmen
                paragraphs:
                  - >-
                    Wir klären Installation, Konfiguration und Prüfungen sowie mögliche Unterbrechungen im
                    laufenden Betrieb. Einzelne Projekte und gezielte Fehlersuche sind ebenso möglich wie
                    eine spätere, separat vereinbarte Wartung.
    - id: kurzer-kontakt
      kind: cta
      recipe: cta.quick-contact
      content:
        eyebrow: Der erste Schritt
        title: Was soll sich in Ihrem Büro ändern?
        body: >-
          Rufen Sie uns an oder beschreiben Sie Ihr Vorhaben kurz im Formular. Das erste Gespräch ist
          kostenlos. Falls ein kostenpflichtiger Diagnosebesuch sinnvoll ist, erklären wir die Kosten vorab.
        callLabel: Zum Netzwerkprojekt anrufen
        enquiryLabel: Vorhaben beschreiben
        enquiryTarget: kontakt
    - id: kontakt
      kind: contact
      recipe: contact.enquiry-email
      content:
        title: Erzählen Sie uns von Ihrem Büro
        intro: >-
          Beschreiben Sie die Räume, das Problem oder die geplante Änderung und wichtige Termine.
          Ungefähre Angaben reichen für ein erstes Gespräch aus.
        formIntro: >-
          Das Formular bereitet einen Entwurf in Ihrem E-Mail-Programm vor. Bitte prüfen und versenden Sie
          ihn dort selbst; diese Seite sendet Ihre Nachricht nicht direkt. * Pflichtfelder.
        request: Was benötigt Ihr Büro?
        requestPlaceholder: >-
          Zum Beispiel: Wir ziehen in ein Büro in Moabit mit acht Arbeitsplätzen und einem Besprechungsraum.
          Wir benötigen Verkabelung und WLAN und möchten unseren Switch möglichst weiterverwenden.
          Bitte keine Passwörter oder Zugangscodes angeben.
        affectedPlaceholder: Zum Beispiel Büro-WLAN, Verkabelung, Netzwerkschrank, NAS oder VPN
        emailSubject: Anfrage zum Büro-Netzwerk in Berlin
    - id: themen
      kind: scope
      recipe: scope.chapter-links
      content:
        eyebrow: Technische Details
        title: Wie die Teile Ihres Büro-Netzwerks zusammenarbeiten
        intro: >-
          Der passende Umfang hängt vom Gebäude, den Geräten und den benötigten Diensten ab. Hier finden
          Sie die wichtigsten Entscheidungen erklärt. Sie können einzelne Bereiche oder ein zusammenhängendes
          Projekt mit uns besprechen.
        items:
          - title: Netzwerkverkabelung und Netzwerkschrank
            body: Kabelwege, Netzwerkdosen und die Verbindung zu den Arbeitsplätzen.
            target: netzwerkverkabelung
          - title: Business-WLAN
            body: Zugangspunkte, Besprechungsräume sowie Zugänge für Mitarbeitende und Gäste.
            target: business-wlan
          - title: Netzwerkgeräte und Konfiguration
            body: Router, verwaltbare Switches und eine sinnvolle Trennung von Zugängen.
            target: netzwerkgeraete
          - title: NAS und gemeinsamer Speicher
            body: Dateizugriff, Berechtigungen und eine unabhängige Datensicherung.
            target: netzwerkspeicher
          - title: VPN und Fernzugriff
            body: Berechtigter Zugriff auf vereinbarte interne Ressourcen von außerhalb.
            target: fernzugriff
    - id: netzwerkverkabelung
      kind: explanation
      recipe: explanation.connection-path
      content:
        eyebrow: Die physische Infrastruktur
        title: Netzwerkverkabelung und Netzwerkschränke für Ihr Büro
        paragraphs:
          - >-
            Feste Arbeitsplätze, Netzwerkspeicher und WLAN-Zugangspunkte lassen sich sinnvoll per Kabel
            anbinden. Wir planen die LAN-Verkabelung nach den Räumen, vorhandenen Kabelwegen und den Orten,
            an denen Geräte tatsächlich genutzt werden.
          - >-
            Zum Auftrag können Netzwerkdosen, Patchfelder, ein Netzwerkschrank und eine geordnete Verbindung
            der Anschlüsse gehören. Den baulichen Umfang und vereinbarte Abschlussarbeiten klären wir vorab;
            vorhandene Wege und der Zugang zu den Räumen fließen in die Planung ein.
        diagramTitle: Vom Netzwerkschrank zum Arbeitsplatz
        source:
          title: Netzwerk-Switch
          body: Zentrale Anschlüsse mit geeigneter Portzahl und Kapazität für die vereinbarten Geräte.
        route:
          title: Patchfeld, Kabel und Netzwerkdose
          body: Ein zugeordneter Kabelweg verbindet den Netzwerkschrank mit dem Raum oder Arbeitsplatz.
        destinations:
          - title: Arbeitsplätze
            body: Kabelverbindungen für Computer und geeignete Geräte am Schreibtisch.
          - title: WLAN-Zugangspunkte
            body: Eine Verbindung zum Netzwerk; die passende Stromversorgung wird mitgeprüft.
          - title: Gemeinsame Geräte
            body: Anschlüsse für NAS, Netzwerkdrucker oder Ausstattung im Besprechungsraum.
        caption: >-
          Vereinfachte Darstellung eines Verbindungswegs. Aufbau, Zahl der Anschlüsse und Geräte werden
          passend zu Ihren Räumen geplant.
        planning:
          title: Installationsdetails rechtzeitig klären
          body: >-
            Bei einem neuen Büro oder Umbau lassen sich diese Fragen leichter beantworten, bevor Möbel
            aufgestellt und Oberflächen fertiggestellt sind.
          items:
            - title: Kabelwege und Genehmigungen
              body: >-
                Vorhandene Kanäle und mögliche Aufputzwege prüfen; nötige Freigaben von Vermieter oder
                Gebäudeverwaltung für die vereinbarten Arbeiten klären.
            - title: Platz und Kapazität
              body: >-
                Raum für Patchkabel, Stromversorgung und Belüftung sowie sinnvolle Reserven für absehbare
                Erweiterungen berücksichtigen.
            - title: Prüfung und Beschriftung
              body: >-
                Vereinbarte Verbindungen prüfen und Dosen sowie Patchfelder zuordnen, damit der installierte
                Aufbau später nachvollziehbar bleibt.
    - id: business-wlan
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: Funkabdeckung und Zugänge
        title: Business-WLAN passend zu Ihren Räumen und Ihrer Nutzung
        intro: >-
          Besprechungsräume, Arbeitsplätze und Gästebereiche stellen unterschiedliche Anforderungen an das
          WLAN. Bevor wir Zugangspunkte platzieren, betrachten wir Grundriss, Baumaterialien, Geräte und
          vorhandene Kabelverbindungen.
        blocks:
          - type: table
            title: Drei Fragen für die WLAN-Planung
            columns:
              - Entscheidend ist
              - Was wir berücksichtigen
            rows:
              - - Abdeckung
                - Wo Verbindungen gebraucht werden, auch in durch Wände oder Stockwerke getrennten Räumen.
              - - Kapazität
                - Wie viele Geräte und gleichzeitige Anwendungen die stark genutzten Bereiche tragen sollen.
              - - Zugang
                - Wer interne Ressourcen benötigt und wer ausschließlich einen Internetzugang für Gäste braucht.
          - type: prose
            paragraphs:
              - >-
                Wo es praktikabel ist, werden Access Points per Kabel mit dem Netzwerk verbunden. Ist kein
                sinnvoller Kabelweg möglich, prüfen wir, ob eine Funkverbindung bei passender Platzierung
                die vorgesehene Nutzung unterstützen kann.
              - >-
                Nach der Einrichtung prüfen wir die vereinbarten Bereiche und typische Anwendungen.
                Abdeckung und Leistung hängen von Räumen, Endgeräten und Störeinflüssen ab. Zusätzliche
                Zugangspunkte allein garantieren daher noch kein bestimmtes Ergebnis.
    - id: netzwerkgeraete
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: Geräteauswahl und Einstellungen
        title: Verwaltbare Netzwerkgeräte sinnvoll einsetzen
        intro: >-
          Router, Switches und WLAN-Geräte müssen zusammenarbeiten. Wir wählen und konfigurieren sie für die
          Anschlüsse, Dienste und Zugriffsregeln, die Ihr Büro tatsächlich benötigt.
        blocks:
          - type: columns
            columns:
              - title: Kapazität und Kompatibilität prüfen
                paragraphs:
                  - >-
                    Portzahl, Verbindungsgeschwindigkeiten, WLAN-Funktionen und die Stromversorgung geeigneter
                    Access Points beeinflussen die Auswahl. Vor einer Erweiterung prüfen wir vorhandene Geräte,
                    Administrationszugänge und die Unterstützung durch den Hersteller.
              - title: Zugänge nach Bedarf trennen
                paragraphs:
                  - >-
                    Ein Gastzugang sollte nicht automatisch Bürodateien oder interne Geräte erreichen.
                    Wenn die Technik es unterstützt, können getrennte Netze und Zugriffsregeln zwischen
                    Gästen, Mitarbeitenden und ausgewählten gemeinsamen Systemen unterscheiden.
          - type: callout
            tone: quiet
            title: Änderungen im laufenden Betrieb brauchen eine Abstimmung
            body: >-
              Vor Eingriffen mit möglichen Unterbrechungen vereinbaren wir ein Arbeitsfenster, benennen die
              betroffenen Dienste und klären praktikable Rückfallmöglichkeiten. Geräteübersicht und relevante
              Konfigurationsinformationen gehören zur vereinbarten Übergabe.
    - id: netzwerkspeicher
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: NAS und gemeinsame Dateien
        title: Netzwerkspeicher für die Zusammenarbeit im Team
        intro: >-
          Ein NAS kann berechtigten Personen einen gemeinsamen Speicherort im Büro bereitstellen. Wir binden
          das Gerät in Ihr Netzwerk ein, richten Benutzer und Berechtigungen ein und prüfen den Zugriff von
          den vereinbarten Computern.
        blocks:
          - type: prose
            paragraphs:
              - >-
                Wir klären, welche Ordner benötigt werden, wer Dateien verändern darf und ob vorhandene
                Daten umziehen sollen. Kapazität, Gerätekompatibilität und der Zustand des bisherigen Speichers
                bestimmen mit, was sinnvoll weitergenutzt werden kann.
          - type: callout
            tone: solid
            title: Gemeinsamer Speicher ersetzt keine Datensicherung
            body: >-
              Kopien auf demselben NAS, Festplattenredundanz und Synchronisierung sind kein Ersatz für ein
              unabhängiges Backup. Wir besprechen getrennte Sicherungen, Zuständigkeiten und vereinbarte
              Wiederherstellungsprüfungen. Größere Datenumzüge, Backup-Systeme und Serverprojekte benötigen
              einen eigenen Leistungsumfang.
    - id: fernzugriff
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: Zugriff von außerhalb
        title: VPN-Zugänge für benötigte interne Ressourcen
        intro: >-
          Manche Mitarbeitende brauchen unterwegs oder im Homeoffice Zugriff auf Bürodateien oder eine interne
          Anwendung. Zuerst klären wir, welche Ressource benötigt wird, wer dazu berechtigt ist und ob ein VPN
          dafür die passende Verbindung ist.
        blocks:
          - type: prose
            paragraphs:
              - >-
                Geeignete VPN-Zugänge können Teil des vereinbarten Netzwerkprojekts sein. Dazu prüfen wir
                kompatible Geräte, persönliche Zugänge und die Verbindung von den vorgesehenen Endgeräten.
                Mehrfaktor-Authentifizierung und eine Begrenzung der erreichbaren Ressourcen werden, soweit von der eingesetzten Technik unterstützt, bei der
                Zugriffsplanung berücksichtigt.
              - >-
                Der Fernzugriff hängt auch vom Internetanschluss des Büros, der Verbindung am jeweiligen
                Arbeitsort und unterstützten Geräten ab. Bei Austritten oder geänderten Aufgaben sollten Rechte
                überprüft werden. Die Zuständigkeit für Updates und spätere Betreuung wird bei der Übergabe geklärt.
          - type: callout
            tone: outline
            title: Weitergehende Anforderungen separat abgrenzen
            body: >-
              Ein VPN sichert nicht automatisch das gesamte Unternehmen ab. Penetrationstests, die Untersuchung
              von Sicherheitsvorfällen und umfassende Cybersecurity- oder Compliance-Beratung gehören nicht
              zu dieser Netzwerkleistung. Auch Windows Server, Active Directory und umfangreiche Linux-Server-Arbeiten
              benötigen einen separat geklärten Umfang.
    - id: ablauf
      kind: process
      recipe: process.staged-path
      content:
        eyebrow: Von der Anfrage bis zur Übergabe
        title: So planen und setzen wir die Arbeit um
        intro: >-
          Das Vorgehen gilt für eine einzelne Verbesserung ebenso wie für eine neue Installation. Wie viel
          Planung und Dokumentation sinnvoll ist, richtet sich nach dem Auftrag.
        steps:
          - title: Bedarf verstehen
            body: >-
              Standort, Arbeitsplätze, vorhandene Technik, benötigte Dienste und Termine besprechen.
              Wenn erforderlich, die Umgebung vor Ort ansehen.
          - title: Umfang und Kosten abstimmen
            body: >-
              Arbeiten, Geräte, Beschaffung, Abhängigkeiten und mögliche Unterbrechungen festlegen.
              Diagnosekosten vor einem kostenpflichtigen Besuch erklären.
          - title: Installieren und konfigurieren
            body: >-
              Vereinbarte Verkabelung und Konfiguration umsetzen. Zusätzliche Arbeiten, Geräte oder
              weitere Besuche vorab mit Ihnen abstimmen.
          - title: Prüfen und übergeben
            body: >-
              Vereinbarte Verbindungen und Dienste testen, Änderungen erläutern und praktische Unterlagen
              übergeben. Zuständigkeiten für die weitere Betreuung klären.
    - id: fragen
      kind: faq
      recipe: faq.editorial-answers
      content:
        eyebrow: Vor der Anfrage
        title: Fragen zu Netzwerkprojekten im Büro
        intro: >-
          Für den Anfang reicht eine grobe Beschreibung. Wir helfen Ihnen, die technischen Anforderungen
          einzugrenzen und zu klären, ob der Auftrag zu unserem Angebot passt.
        items:
          - question: Können wir auch eine kleine Aufgabe ohne Wartungsvertrag beauftragen?
            paragraphs:
              - >-
                Ja. Zusätzliche Anschlüsse, ein WLAN-Problem oder eine vereinbarte Konfigurationsänderung
                können eigenständige Aufträge sein. Gelegentliche Unterstützung oder regelmäßige Wartung
                können Sie bei Bedarf separat vereinbaren; beides ist keine Voraussetzung für eine Installation.
          - question: Können vorhandene Geräte bleiben und neue Komponenten beschafft werden?
            paragraphs:
              - >-
                Wir prüfen, ob vorhandene Geräte zu den Anforderungen passen und sich administrieren und
                weiter unterstützen lassen. Empfohlene Komponenten können Sie selbst kaufen oder die Beschaffung
                mit uns vereinbaren. Hardware und zusätzliche Arbeiten werden vor Kauf oder Einbau abgestimmt.
          - question: Ist die Umsetzung möglich, während im Büro gearbeitet wird?
            paragraphs:
              - >-
                Ein Teil der Vorbereitung kann parallel zum Betrieb stattfinden. Verkabelungsarbeiten und
                Änderungen an Geräten können Verbindungen jedoch unterbrechen. Wir besprechen die betroffenen
                Dienste und ein geeignetes Zeitfenster. Termine an Werktagen, abends oder samstags können nach
                Vereinbarung möglich sein; Verfügbarkeit und Unterbrechungen werden für den konkreten Auftrag geklärt.
          - question: Wie werden Kosten und ein möglicher Diagnosebesuch vereinbart?
            paragraphs:
              - >-
                Das erste Gespräch ist kostenlos. Für abgrenzbare Arbeiten erstellen wir ein individuelles
                Angebot. Mögliche Kosten für einen Diagnosebesuch erläutern wir, bevor ein solcher Termin
                vereinbart wird. Räume, Kabelwege, Geräte und Leistungsumfang beeinflussen den Aufwand.
          - question: Was passiert, wenn die Störung beim Internetanbieter liegt?
            paragraphs:
              - >-
                Wir können das lokale Netzwerk untersuchen und helfen, interne Probleme von einer Störung
                des Anbieteranschlusses zu unterscheiden. Leitungsfehler auf Anbieterseite, Tarifänderungen und
                die Wiederherstellung des externen Anschlusses bleiben beim Provider. Ein Notdienst, eine feste
                Reaktionszeit oder ein SLA werden damit nicht zugesagt.
    - id: abschluss-kontakt
      kind: cta
      recipe: cta.quick-contact
      content:
        eyebrow: Nächsten Schritt besprechen
        title: Beschreiben Sie uns Ihr Netzwerkvorhaben
        body: >-
