id: setup-data-transfer-de
translationId: setup-data-transfer
locale: de
audience: private
order: 4
slug: einrichtung-datenumzug
purpose: "Kaufberatung, Einrichtung und planbarer Datenumzug für neue Windows- und Mac-Computer, inklusive Backup, E-Mail und Peripherie."
navigation:
  group: device-home
  label: "PC-Einrichtung & Datenumzug"
page:
  template: recipe-service
  technicalDepth: informative
  theme:
    variant: workspace
    state: "Altes und neues Gerät, persönliche Daten, Konten, Sicherung und Peripherie werden als geordneter Gerätewechsel sichtbar."
    title: "Vom alten Gerät zu einem fertig eingerichteten neuen Computer"
    description: "Auswahl, Einrichtung, Datenübernahme, Backup und angeschlossene Geräte werden als nachvollziehbarer Wechsel statt als einzelne Technikaufgaben gezeigt."
  storyboard:
    - role: situation
      composition: wide
      visualState: conflict
      eyebrow: "Ein Gerätewechsel steht an"
      title: "Ein neuer Computer soll passen – und danach einfach nutzbar sein"
      text: "Beim Wechsel auf einen neuen PC, Laptop oder Mac geht es selten nur um das Gerät selbst. Die passende Ausstattung, persönliche Daten, E-Mail, wichtige Programme, Drucker und eine sinnvolle Sicherung sollen am Ende zusammenpassen, ohne den alten Zustand ungeprüft zu kopieren."
      points:
        - "Passendes Gerät nach tatsächlicher Nutzung auswählen"
        - "Persönliche Daten und wichtige Arbeitsabläufe mitnehmen"
        - "Backup und vorhandene Geräte von Anfang an mitdenken"
      callouts:
        - "Gerät auswählen"
        - "Daten übernehmen"
        - "Backup planen"
        - "Weiterarbeiten"
    - role: investigation
      composition: text-left
      visualState: dependencies
      eyebrow: "Vor dem Umzug klären"
      title: "Was wirklich mit muss, hängt von Ihrem bisherigen Alltag ab"
      text: "Wir betrachten das vorhandene Gerät, die wichtigsten Daten, E-Mail-Konten, Programme, angeschlossene Geräte und bestehende Sicherungen. Wenn noch kein neuer Computer gewählt ist, klären wir außerdem, welche Leistung, Größe und Ausstattung zur tatsächlichen Nutzung passen."
      points:
        - "Nutzung und Anforderungen für den neuen Computer einordnen"
        - "Vorhandene persönliche Daten und Konten für den Umzug prüfen"
        - "Backup, NAS, Drucker und Heimnetz bei Bedarf einbeziehen"
      callouts:
        - "Windows oder Mac"
        - "Persönliche Daten"
        - "E-Mail & Konten"
        - "Sicherung"
    - role: intervention
      composition: system
      visualState: controlled-change
      eyebrow: "Auswählen, einrichten, übertragen"
      title: "Der neue Computer wird als vollständiger Arbeitsplatz aufgebaut"
      text: "Auf Wunsch empfehlen oder beschaffen wir ein geeignetes Gerät, richten Windows oder macOS ein und übernehmen die vereinbarten persönlichen Daten. Danach können E-Mail, wichtige Programme, Drucker, Backup und weitere benötigte Verbindungen so eingerichtet werden, dass der neue Computer im Alltag wirklich einsatzbereit ist."
      points:
        - "Neues Gerät einrichten und unnötige Vorinstallationen bei Bedarf bereinigen"
        - "Persönliche Daten zwischen Windows und Mac nach sinnvoller Methode übertragen"
        - "E-Mail, Backup, NAS, Drucker und wichtige Anwendungen nach Absprache einrichten"
      callouts:
        - "System eingerichtet"
        - "Daten übernommen"
        - "E-Mail verbunden"
        - "Backup vorbereitet"
    - role: outcome
      composition: text-right
      visualState: verified
      eyebrow: "Gemeinsam prüfen"
      title: "Der Wechsel endet erst, wenn die wichtigen Dinge wieder erreichbar sind"
      text: "Zum Abschluss prüfen wir die vereinbarten Daten, Konten, Programme und Geräte gemeinsam. Der neue Computer soll verständlich übergeben werden, und für das alte Gerät kann nach Wunsch festgelegt werden, ob es als Rückfalloption bleibt, weitergegeben oder später gelöscht wird."
      points:
        - "Wichtige persönliche Daten und Konten stichprobenartig prüfen"
        - "Backup und angeschlossene Geräte nach vereinbartem Umfang testen"
        - "Altes Gerät erst nach Absprache verändern oder löschen"
      callouts:
        - "Daten geprüft"
        - "Backup erreichbar"
        - "Geräte verbunden"
        - "Übergabe geklärt"
seo:
  title: "Neuen Computer einrichten in Berlin | Datenumzug"
  description: "Neuen PC, Laptop oder Mac in Berlin auswählen und einrichten lassen. Wir helfen beim Übertragen lesbarer Daten, bei E-Mail, Druckern und einer passenden Sicherung."
  intent: "Hilfe bei Kaufberatung, Einrichtung und Datenübertragung auf einen neuen Windows-PC, Laptop oder Mac in Berlin finden."
hero:
  eyebrow: "Neuer PC oder Mac · Vor Ort in Berlin"
  title: "Neuen Computer einrichten und Daten übernehmen"
  intro: "Wir helfen bei der Auswahl und Einrichtung eines Windows-PCs, Laptops oder Macs, übertragen vereinbarte lesbare Dateien und verbinden E-Mail und Zubehör. Haben Sie den Computer bereits gekauft, beginnen wir mit der Einrichtung. Auch Kaufberatung oder eine einzelne Einrichtungsaufgabe können ein eigener Auftrag sein."
problems:
  eyebrow: "Typische Ausgangslagen"
  title: "Wenn ein Gerätewechsel mehr ist als Auspacken und Einschalten"
  intro: "Viele Anfragen beginnen nicht mit einem Defekt, sondern mit einem geplanten Wechsel. Der alte Computer funktioniert noch, ist aber zu langsam oder unpraktisch, ein neues Gerät steht bereits bereit oder die richtige Kaufentscheidung ist noch offen."
  items:
    - "Ein neuer PC, Laptop oder Mac wird benötigt, aber Modell und Ausstattung sind noch unklar"
    - "Ein neues Gerät ist bereits vorhanden und soll vollständig für den Alltag eingerichtet werden"
    - "Persönliche Daten sollen vom alten Computer auf das neue Gerät übernommen werden"
    - "Der Wechsel geht von Windows zu Mac, von Mac zu Windows oder innerhalb derselben Plattform"
    - "E-Mail, Drucker, wichtige Programme und vorhandene Geräte sollen anschließend wieder funktionieren"
    - "Beim Gerätewechsel soll gleichzeitig eine sinnvolle Sicherung mit externer Festplatte, NAS oder vorhandener Backup-Lösung eingerichtet werden"
included:
  eyebrow: "Was wir übernehmen können"
  title: "Von der Kaufentscheidung bis zur fertigen Übergabe"
  intro: "Der Umfang wird vorab abgestimmt. Manche Kunden brauchen nur einen sauberen Datenumzug, andere möchten Auswahl, Beschaffung, Einrichtung, Backup und angeschlossene Geräte als einen zusammenhängenden Wechsel erledigen."
  items:
    - "Kaufberatung für Windows-PCs, Laptops und Macs nach tatsächlicher Nutzung und auf Wunsch Beschaffung des passenden Geräts"
    - "Einrichtung des neuen Computers und Bereinigung unnötiger Vorinstallationen nach Bedarf"
    - "Übernahme vereinbarter persönlicher Daten zwischen Windows- und Mac-Systemen"
    - "Einrichtung von E-Mail und Konten, darunter Outlook, Gmail sowie gängige deutsche Mailanbieter"
    - "Einrichtung wichtiger Programme sowie Drucker, Scanner, Monitore, Docks und weiterer Peripherie nach Absprache"
    - "Aufbau oder Einbindung einer passenden Sicherung über externen Speicher, NAS, Time Machine oder vorhandene Windows-Backup-Lösungen"
outcome:
  eyebrow: "Ziel der Unterstützung"
  title: "Ein neuer Computer, der im Alltag wirklich bereit ist"
  text: "Das Ziel ist nicht, möglichst viel vom alten System zu kopieren, sondern die vereinbarten Daten und Funktionen sinnvoll auf das neue Gerät zu bringen. Sie erhalten einen eingerichteten Computer, wissen, wo Ihre wichtigen Daten liegen und können entscheiden, wie Backup und altes Gerät anschließend behandelt werden sollen."
cta:
  title: "Gerätewechsel kurz beschreiben"
  text: "Nennen Sie altes Gerät, gewünschtes oder bereits gekauftes neues Gerät, Ihre typische Nutzung und ob Datenübernahme, Backup oder Kaufberatung benötigt werden."
  prompt: "Hilfreich sind Modell oder ungefähres Alter des alten Geräts, geplante Nutzung, vorhandene Sicherung und die Frage, ob das neue Gerät bereits gekauft wurde. Bitte keine Passwörter oder Wiederherstellungscodes senden."
composition:
  related:
    eyebrow: "Weitere Hilfe für zu Hause"
    title: "Geht es um eine Störung statt einen Gerätewechsel?"
    linkLabel: "Leistung ansehen"
    serviceIds:
      - computer-laptop
      - software-optimisation
      - wifi-home-network
  contact:
    title: "Einrichtung oder Datenumzug anfragen"
    intro: "Nennen Sie Ihr bisheriges Gerät, das neue Modell – falls schon vorhanden – und was Sie übernehmen möchten. Auch eine einzelne Einrichtungsfrage ist willkommen."
    formIntro: "Das Formular erstellt einen Entwurf in Ihrem E-Mail-Programm. Bitte prüfen und senden Sie ihn dort selbst; die Website verschickt nichts direkt. Keine Passwörter, Bestätigungscodes oder Wiederherstellungsschlüssel mitsenden."
    affectedPlaceholder: "Zum Beispiel neuer Windows-Laptop, PC oder MacBook"
    request: "Was möchten Sie neu einrichten oder übertragen?"
  contactAfter: leistungen
  sections:
    - id: einstieg
      kind: hero
      recipe: hero.editorial-art
      content:
        eyebrow: "Neuer PC oder Mac · Vor Ort in Berlin"
        title: "Neuen Computer einrichten und Daten übernehmen"
        intro: "Wir helfen bei der Auswahl und Einrichtung eines Windows-PCs, Laptops oder Macs, übertragen vereinbarte lesbare Dateien und verbinden E-Mail und Zubehör. Haben Sie den Computer bereits gekauft, beginnen wir mit der Einrichtung. Auch Kaufberatung oder eine einzelne Einrichtungsaufgabe können ein eigener Auftrag sein."
        media:
          subject: home-office
          src: /images/concept-ii/private/P3.png
          alt: "Illustration eines häuslichen Arbeitsplatzes mit Laptop und Blick auf Berlin."
        actions:
          - label: "Gerätewechsel anfragen"
            target: kontakt
          - label: "Leistungen ansehen"
            target: leistungen
    - id: ausgangspunkt
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "Vor dem Wechsel"
        title: "Hilfe vor dem Kauf und bei der Einrichtung"
        intro: "Sie müssen nicht alle Schritte beauftragen. Wir steigen dort ein, wo Sie stehen – von der Kaufberatung bis zum Umzug der wichtigsten Dateien."
        blocks:
          - type: columns
            columns:
              - title: "Sie haben noch kein Gerät ausgewählt"
                paragraphs:
                  - "Wir sprechen über Ihre Aufgaben, Budget, Bildschirmgröße, Mobilität, notwendige Programme und vorhandenes Zubehör. Daraus ergibt sich, welcher Windows-PC, Laptop oder Mac sinnvoll passt. Eine Beschaffung können wir auf Wunsch gesondert vereinbaren."
              - title: "Der neue Computer steht schon bereit"
                paragraphs:
                  - "Wir richten Benutzer, Updates und benötigte Programme ein und planen, welche Daten vom bisherigen Gerät übernommen werden. Dabei kann es sinnvoll sein, auch das vorhandene Backup zu prüfen oder neu zu organisieren."
          - type: callout
            tone: quiet
            title: "Das bisherige Gerät zunächst behalten"
            body: "Falls es noch funktioniert, halten Sie es mit Netzteil und gegebenenfalls externen Laufwerken bereit. Löschen oder verschenken Sie den alten Computer besser erst, wenn die vereinbarten Daten und Funktionen auf dem neuen geprüft wurden."
    - id: leistungen
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "Was wir übernehmen können"
        title: "Windows oder macOS einrichten, Dateien übertragen und Geräte verbinden"
        intro: "Wir stimmen den Umfang auf Ihren tatsächlichen Bedarf ab. Von der Einrichtung eines einzelnen Laptops bis zum Wechsel des gesamten häuslichen Arbeitsplatzes sind unterschiedliche Schritte möglich."
        blocks:
          - type: columns
            columns:
              - title: "Den Computer vorbereiten"
                paragraphs:
                  - "Wir richten Windows oder macOS, den vorgesehenen Benutzer und Updates ein. Wichtige Programme, Drucker, Scanner, Monitore oder Dockingstations können nach Absprache angeschlossen und überprüft werden."
              - title: "Wichtige Daten und Konten übernehmen"
                paragraphs:
                  - "Wir übertragen vereinbarte, normal lesbare Dokumente, Bilder und persönliche Ordner und richten E-Mail- sowie Cloud-Konten erneut ein. Programme und Lizenzen müssen häufig separat installiert oder aktiviert werden, statt sich einfach kopieren zu lassen."
          - type: callout
            tone: quiet
            title: "Datensicherung mitdenken"
            body: "Ein abgeschlossener Datenumzug ist noch kein laufendes Backup. Wir können eine passende Sicherung mit externem Speicher, NAS, Time Machine oder einer geeigneten Windows-Lösung besprechen und einrichten."
    - id: kaufberatung
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "Kaufberatung für PC, Laptop und Mac"
        title: "Gerät und Ausstattung nach Ihren Aufgaben auswählen"
        intro: "Mehr Leistung auf dem Papier macht nicht automatisch den passendsten Computer. Wichtig sind Ihre Programme, Arbeitsweise und die Geräte, die weiter genutzt werden sollen."
        blocks:
          - type: prose
            paragraphs:
              - "Wir vergleichen praktische Fragen wie Desktop oder Laptop, Windows oder Mac, Bildschirmgröße, Arbeitsspeicher, Speicherplatz und Anschlüsse. Dabei beziehen wir ein, ob wichtige Anwendungen verfügbar sind und welches Zubehör kompatibel bleibt."
          - type: columns
            columns:
              - title: "Vorhandenes Zubehör weiterverwenden"
                paragraphs:
                  - "Monitor, Drucker, externe Festplatte oder anderes Zubehör müssen nicht allein wegen des Computerwechsels ersetzt werden. Wir prüfen, ob Anschlüsse, Treiber und unterstützte Funktionen zum neuen Gerät passen."
              - title: "Programme vor dem Kauf prüfen"
                paragraphs:
                  - "Fachanwendungen, Abonnements, Lizenzen und ältere Software können die Auswahl einschränken. Wir klären das frühzeitig, statt einen unveränderten Betrieb auf einem anderen System zu versprechen."
    - id: datenuebertragung
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "Daten auf den neuen PC übertragen"
        title: "Welche Dateien und Konten sollen übernommen werden?"
        intro: "Ein guter Datenumzug beginnt mit einer Bestandsaufnahme: Welche Ordner werden gebraucht, wo liegen sie und wie sollen sie am neuen Computer wiederzufinden sein? Auch der Wechsel zwischen Windows und Mac ist nach Prüfung möglich."
        blocks:
          - type: table
            title: "Was wir vor dem Übertragen klären"
            columns:
              - "Bereich"
              - "Wichtige Fragen"
            rows:
              - - "Dokumente, Fotos und persönliche Dateien"
                - "Welche normal lesbaren Ordner sind wichtig und wohin sollen sie auf dem neuen Gerät?"
              - - "E-Mail und Cloud-Dateien"
                - "Was liegt beim Anbieter, was lokal und was muss erneut angemeldet oder synchronisiert werden?"
              - - "Programme und Lizenzen"
                - "Gibt es unterstützte Installationsdateien, gültige Lizenzen und die benötigten Konten?"
              - - "Windows- und Mac-Wechsel"
                - "Sind Dateiformate, Kontozugänge und benötigte Anwendungen auf dem Zielsystem nutzbar?"
          - type: callout
            tone: quiet
            title: "Grenzen beim Datenumzug"
            body: "Wir übernehmen normal lesbare Daten. Beschädigte oder nicht lesbare Datenträger erfordern eine andere, spezialisierte Bewertung. Wir versprechen keine Wiederherstellung fehlender Dateien und umgehen weder Passwörter noch Verschlüsselung."
    - id: konten-und-zubehoer
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "Damit der neue Computer im Alltag funktioniert"
        title: "E-Mail, Programme, Drucker und weiteres Zubehör einrichten"
        intro: "Ein kopierter Ordner allein macht noch keinen funktionierenden Arbeitsplatz. Entscheidend ist, ob die alltäglichen Aufgaben nach dem Wechsel wieder möglich sind."
        blocks:
          - type: columns
            columns:
              - title: "E-Mail und Benutzerkonten"
                paragraphs:
                  - "Wir können Outlook, Gmail und gängige deutsche E-Mail-Anbieter sowie relevante Cloud-Dienste erneut einrichten. Dabei prüfen wir, ob Nachrichten oder Dateien synchronisiert werden oder nur lokal gespeichert waren. Passwörter und Bestätigungscodes geben Sie möglichst selbst ein."
              - title: "Programme und Peripherie"
                paragraphs:
                  - "Benötigte Programme werden nach Absprache rechtmäßig installiert und eingerichtet. Wir verbinden kompatible Drucker, Scanner, Monitore und Docks und erklären, falls alte Treiber oder bestimmte Programmlizenzen nicht mehr unterstützt werden."
          - type: prose
            paragraphs:
              - "Zum Abschluss kontrollieren wir gemeinsam die vereinbarten Funktionen, etwa eine Datei öffnen, E-Mail abrufen, drucken oder auf den vorgesehenen Speicher zugreifen. Offene Punkte und geänderte Einstellungen benennen wir klar."
    - id: backup-und-altgeraet
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "Nach der Übernahme"
        title: "Backup prüfen und über das alte Gerät entscheiden"
        intro: "Bevor der bisherige Computer ausgemustert wird, sollten die wichtigen Dateien am neuen Ort geprüft sein. Eine passende Sicherung reduziert das Risiko, nach dem nächsten Defekt wieder von vorn beginnen zu müssen."
        blocks:
          - type: columns
            columns:
              - title: "Sicherung für die neuen Daten"
                paragraphs:
                  - "Je nach Umgebung können wir eine externe Festplatte, ein NAS, Time Machine oder eine geeignete Windows-Sicherung einrichten. Wir besprechen, welche Daten sie umfasst und wie Sie kontrollieren können, ob die Sicherung funktioniert."
              - title: "Das alte Gerät nicht vorschnell löschen"
                paragraphs:
                  - "Sie können den alten Computer vorerst als Reserve behalten, nach Prüfung weitergeben oder später fachgerecht entsorgen lassen. Vor einem vereinbarten Zurücksetzen sprechen wir über sensible Dateien und Konten; eine Löschung erfolgt nicht automatisch."
    - id: ablauf
      kind: process
      recipe: process.staged-path
      content:
        eyebrow: "Von der Planung bis zur Übergabe"
        title: "So organisieren wir den Computerwechsel"
        intro: "Welche Schritte nötig sind, hängt von Ihren Geräten und den gewünschten Daten ab. Den Umfang vereinbaren wir vorab."
        steps:
          - title: "Ausgangslage schildern"
            body: "Nennen Sie bisherigen Computer, gegebenenfalls das neue Gerät und Ihren Berliner Stadtteil. Wir besprechen, wofür Sie Unterstützung benötigen."
          - title: "Daten und Kosten abstimmen"
            body: "Wir klären wichtige lesbare Dateien, Programme, Konten und Backup-Fragen. Das erste Gespräch ist kostenlos; eine mögliche kostenpflichtige Diagnose vor Ort erklären wir vor der Vereinbarung."
          - title: "Einrichten und übertragen"
            body: "Wir bereiten das neue Gerät vor und übernehmen die vereinbarten Daten und Einstellungen. Zusätzlich nötige Arbeiten sprechen wir vorher ab."
          - title: "Gemeinsam prüfen"
            body: "Wir testen die wichtigen Aufgaben, erklären Änderungen und offene Grenzen und besprechen, was anschließend mit dem alten Gerät geschieht."
    - id: fragen
      kind: faq
      recipe: faq.editorial-answers
      content:
        eyebrow: "Vor dem Termin"
        title: "Häufige Fragen zu Einrichtung und Datenumzug"
        intro: "Einige Dinge lassen sich schon vor dem Gerätewechsel gut planen."
        items:
          - question: "Helfen Sie auch vor dem Kauf eines neuen PCs oder Laptops?"
            paragraphs:
              - "Ja. Wir besprechen Ihre Aufgaben, notwendige Programme, Budget und die gewünschte Geräteart und helfen, geeignete Windows-PCs, Laptops oder Macs einzugrenzen. Sie können selbst kaufen oder eine gesonderte Beschaffung mit uns vereinbaren."
          - question: "Können Sie Daten zwischen Windows und Mac übertragen?"
            paragraphs:
              - "Wir können einen Wechsel zwischen Windows und macOS planen und normal lesbare Dateien übernehmen. Programme und Einstellungen lassen sich aber nicht immer unverändert übertragen. Formate, Lizenzen und Kontozugänge müssen vorher geprüft werden."
          - question: "Was ist, wenn der alte PC nicht mehr startet?"
            paragraphs:
              - "Zunächst muss geklärt werden, ob die benötigten Daten noch normal lesbar sind. Bei Startproblemen passt eventuell unsere Computer- und Laptop-Hilfe; beschädigte Speichermedien benötigen eine getrennte Bewertung. Eine Datenrettung können wir nicht zusagen."
          - question: "Sind E-Mail, Programme und Drucker danach sofort nutzbar?"
            paragraphs:
              - "Wir vereinbaren, welche Konten, Programme und Geräte zum Auftrag gehören, richten unterstützte Komponenten ein und testen die relevanten Aufgaben. Für manche Programme sind neue Installationen, Lizenzen oder Anmeldungen erforderlich."
          - question: "Was kosten Einrichtung und Datenübertragung?"
            paragraphs:
              - "Das hängt von Geräten, Datenumfang und Komplexität ab; wir erstellen individuelle Angebote. Das erste Gespräch ist kostenlos. Kostenpflichtige Diagnosebesuche, zusätzliche Geräte oder weitere Arbeit sprechen wir vorab mit Ihnen ab."
expanded:
  situations:
    eyebrow: "Geeignete Aufträge"
    title: "Wann sich eine geplante Einrichtung besonders lohnt"
    intro: "Der Service ist für Kunden gedacht, die den Gerätewechsel als zusammenhängende Aufgabe erledigen möchten. Die genaue technische Methode richtet sich nach den vorhandenen Geräten und Daten, nicht nach einem starren Übertragungsschema."
    items:
      - title: "Das neue Gerät ist noch nicht gewählt"
        text: "Wir klären, wofür der Computer tatsächlich genutzt wird, welche Ausstattung sinnvoll ist und welche Geräteklasse zu den Anforderungen passt. Auf Wunsch können wir ein passendes Gerät empfehlen oder beschaffen und anschließend vollständig einrichten."
      - title: "Der neue PC, Laptop oder Mac steht schon bereit"
        text: "Das Gerät wird eingerichtet und die vereinbarten persönlichen Daten, E-Mail-Konten, Programme und Peripheriegeräte werden schrittweise wieder nutzbar gemacht."
      - title: "Wechsel zwischen Windows und Mac"
        text: "Auch ein Plattformwechsel kann geplant werden. Dabei prüfen wir, welche persönlichen Daten und Arbeitsabläufe sinnvoll übernommen werden können und welche Anwendungen oder Einstellungen auf dem neuen System neu aufgebaut werden sollten."
      - title: "Backup soll gleich mit eingerichtet werden"
        text: "Ein Gerätewechsel ist ein guter Zeitpunkt, eine vorhandene Sicherung zu prüfen oder eine passende Lösung über externen Speicher, NAS, Time Machine oder Windows-Backup einzurichten."
      - title: "Das alte Gerät soll sauber übergeben werden"
        text: "Nach erfolgreicher Übernahme kann das alte Gerät auf Wunsch als Rückfalloption bleiben, für eine Weitergabe vorbereitet oder nach ausdrücklicher Freigabe gelöscht werden."
  process:
    eyebrow: "Vom Bedarf zur Übergabe"
    title: "Erst entscheiden, was gebraucht wird – dann den Wechsel durchführen"
    intro: "Ein guter Gerätewechsel beginnt nicht mit dem Kopieren von Dateien. Zuerst klären wir Nutzung, Zielgerät, Datenzustand und gewünschte Zusatzarbeiten, damit Aufwand und Risiken vor der eigentlichen Übertragung sichtbar sind."
    steps:
      - title: "Bedarf aufnehmen"
        text: "Wir klären Nutzung, vorhandenes Gerät, gewünschte Plattform, wichtige Daten, E-Mail, Programme, Peripherie und vorhandene Sicherungen."
      - title: "Gerät auswählen"
        text: "Wenn noch kein neues Gerät vorhanden ist, empfehlen wir eine passende Geräteklasse oder konkrete Ausstattung und können die Beschaffung nach Absprache übernehmen."
      - title: "Bestand prüfen"
        text: "Vor der Übertragung prüfen wir, ob das alte Gerät und die benötigten Daten normal zugänglich sind und welche Umzugsmethode sinnvoll ist."
      - title: "Neues System einrichten"
        text: "Windows oder macOS wird eingerichtet und für die vereinbarte Nutzung vorbereitet, bevor die persönlichen Daten und weiteren Dienste übernommen werden."
      - title: "Daten und Dienste übernehmen"
        text: "Persönliche Daten, E-Mail, benötigte Anwendungen, Drucker, Backup und weitere vereinbarte Komponenten werden schrittweise eingerichtet oder übertragen."
      - title: "Prüfen und übergeben"
        text: "Wir kontrollieren die wichtigen Funktionen gemeinsam und ändern oder löschen das alte Gerät erst, wenn der weitere Umgang ausdrücklich abgestimmt ist."
