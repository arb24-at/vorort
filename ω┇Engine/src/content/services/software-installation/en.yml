problems:
  eyebrow: Start with the symptom
  title: When applications stop cooperating
  intro: Useful clues include the exact error, a recent update and whether the problem affects one application
    or several.
  items:
  - An installer stops, asks for a missing component or rejects the operating system
  - An application crashes, freezes or refuses to open after an update
  - Two programs, add-ons or default settings interfere with one another
  - An account, profile or permission blocks normal application use
included:
