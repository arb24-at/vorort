  intro: We check the device, supported version and licence, agree the scope, change only what is needed and test
    the actual task.
  items:
  - Install and configure suitable, licensed applications
  - Investigate failed installations, update errors and program conflicts
  - Review startup applications and unnecessary software cautiously
  - Check account-related settings, dependencies and everyday workflows
outcome:
