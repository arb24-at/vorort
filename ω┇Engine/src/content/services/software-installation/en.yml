  - id: software-problems
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      eyebrow: Recognise the problem
      title: Software will not install, open or behave as expected
      intro: Different symptoms need different checks. The problem may be the application itself, an operating-system
        requirement, an account setting or something introduced by a recent change. You do not need to identify
        the cause before contacting us.
      blocks:
      - type: table
        title: Common symptoms and useful starting points
        columns:
        - What you notice
        - What we would investigate
        rows:
        - - Installation stops
          - Windows version, publisher requirements, permissions and incomplete earlier installations
        - - The app crashes after an update
          - The update history, application version, plug-ins and supported repair options
        - - Sign-in works elsewhere but not in the app
          - Account status, local profile, saved settings and the permitted access route
        - - Another program changes its behaviour
          - Default applications, add-ons, background components and conflicting versions
      - type: prose
        paragraphs:
        - We begin with the task you need to perform and what changed shortly before the problem appeared. An
          error message is a clue rather than proof that everything must be reinstalled.
  - id: practical-help
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      eyebrow: What we can do
      title: "Software installation and troubleshooting"
      intro: >-
        You can ask us to set up one application or investigate problems involving several programs
        and accounts. We agree which applications and settings need attention before making changes.
      blocks:
      - type: columns
        columns:
        - title: Install and configure
          paragraphs:
          - Check legitimate licensing, compatible versions and the publisher's installation requirements. Set
            up the application, its updates and useful defaults for the person using it.
        - title: Diagnose and simplify
          paragraphs:
          - Investigate unreliable launches, updates, conflicting add-ons and unnecessary startup applications.
            Remove or change items only after checking what depends on them.
      - type: callout
        tone: quiet
        title: Costs and changes are discussed first
        body: The first conversation is free. Work is quoted individually, and any paid diagnostic visit is explained
          before it is arranged. We agree further work before proceeding.
  - id: installation-choices
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      eyebrow: Before an installation
      title: Compatibility, licences and setup choices
      intro: Downloading an installer is often the simplest part. An application must be suitable for the operating
        system, device and user, and it must come from a legitimate publisher or trusted distributor.
      blocks:
      - type: columns
        columns:
        - title: Before installing
          paragraphs:
          - We check the supported Windows version, available storage, required components and licence or subscription
            status. We clarify which account is authorised to use the software and whether another version is
            already present.
        - title: Making it useful
          paragraphs:
          - We configure appropriate defaults, file associations and relevant integrations, then test the task
            that matters—opening a document, printing, signing in or using the required application feature.
      - type: callout
        tone: outline
        title: Older or specialist software
        body: An old installer is not automatically compatible or safe on a newer system. We assess support and
          dependencies before recommending an update, an alternative or no change.
  - id: updates-conflicts
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      eyebrow: When something changes
      title: Application crashes, failed updates and software conflicts
      intro: A crash after an update does not necessarily mean the update was the only cause. A plug-in, user
        profile, missing dependency or saved configuration can produce a similar symptom.
      blocks:
      - type: prose
        paragraphs:
        - We check the precise failure, installed version and recent changes, then choose the least disruptive
          sensible route. That might be an application repair, a supported update, restoring a setting, resolving
          a conflicting add-on or a carefully planned reinstall. Repair and reset options are not available for
          every program, and a reset may change saved preferences.
      - type: callout
        tone: quiet
        title: "Check files and settings before uninstalling"
        body: We discuss important settings, files, licences and available backups before uninstalling or resetting
          software. When account access is involved, the owner must use a legitimate sign-in or recovery route.
  - id: working-method
    kind: process
    recipe: process.staged-path
    content:
      eyebrow: Our approach
      title: How we make software changes carefully
      intro: The order depends on the task, but each stage should leave a clear reason for the next action.
      steps:
      - title: Identify the real task
        body: Record what fails, the exact warning if there is one, the relevant device and what changed recently.
      - title: Check suitability and safeguards
        body: Review compatibility, licensing, permissions and important files. Discuss available backup or recovery
          options before riskier changes.
      - title: Make the agreed change
        body: Install, configure, repair or remove only the justified components, checking behaviour after each
          meaningful step.
      - title: Test and hand over
        body: Open the application, check the agreed account, files or connections, and explain the result plus
          any remaining limitations.
  - id: pc-optimisation
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      eyebrow: When a computer feels slow
      title: "PC optimisation: startup, storage and background apps"
      intro: A slow start or delayed application can have several causes. An overfilled startup list is one possibility;
        low free storage, demanding software, a failing drive or limited hardware may be more important.
      blocks:
      - type: columns
        columns:
        - title: What we can inspect
          paragraphs:
          - Unneeded startup items, duplicate or obsolete applications, browser extensions and background processes.
            We also check whether a clean-up would disturb a program or account you still need.
        - title: What a clean-up cannot promise
          paragraphs:
          - Removing software may reduce avoidable load, but it cannot make incompatible applications supported,
            repair failing components or guarantee a measurable increase in speed. Any hardware issue needs its
            own assessment.
  - id: service-limits
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      eyebrow: The right kind of help
      title: "When to choose computer help or data transfer"
      intro: This page covers applications, updates, configuration and software-related performance. It is not
        a hardware-repair service or a guarantee that missing files can be restored.
      blocks:
      - type: prose
        paragraphs:
        - >-
          For startup, operating-system or account-access problems, see Computer & Laptop Help
          below. For a new computer and the transfer of normally readable files, see Setup & Data
          Transfer. Physical faults need a hardware-repair specialist; damaged or unreadable storage
          needs a separate recovery assessment.
      - type: callout
        tone: outline
        title: Access and supported software
        body: We work with legitimate, licensed and supported software and authorised accounts. We do not ask
          for passwords, licence keys, one-time sign-in codes or recovery codes in a form, and we cannot promise
          to bypass access protection.
  - id: software-questions
    kind: faq
    recipe: faq.editorial-answers
    content:
      eyebrow: Practical questions
      title: Questions about software installation and optimisation
      intro: A few decisions are worth clarifying before an installation or repair.
      items:
      - question: Can you install one particular application?
        paragraphs:
        - Yes, where the software is legitimate, licensed and compatible with the device. We first check the publisher's
          requirements and whether any existing version, account or licence needs attention. Specialist applications
          are assessed individually.
      - question: Is reinstalling Windows the normal solution?
        paragraphs:
        - No. A targeted change is often more proportionate. A wider operating-system reset or reinstall would
          require a separate discussion about its risks, backups, applications and settings; it is not an automatic
          part of installing a program.
      - question: Will cleaning up software definitely speed up my PC?
        paragraphs:
        - Not necessarily. We can check avoidable background load and unused software, but performance also depends
          on storage health, memory, processor demands and the applications you run. We explain when software
          changes are unlikely to solve the underlying problem.
      - question: What should I include in an enquiry?
        paragraphs:
        - Name the application, device or Windows version where known, the exact error and when it started. Tell
          us which everyday task is affected. Do not send a password, licence key, verification code or account-recovery
          information.
