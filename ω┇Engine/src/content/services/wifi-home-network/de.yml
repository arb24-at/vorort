              alt: Illustration eines Wohnraums im Umbau mit vorbereitetem Netzwerkanschluss.
    - id: wlan-mesh
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: WLAN-Reichweite und Zugangspunkte
        title: WLAN und Mesh einrichten
        intro: >-
          Ein neuer Router allein löst nicht jede Funklücke. Wenn Sie die WLAN-Reichweite verbessern
          möchten, zählen vor allem die Wege zwischen Zugangspunkt, Räumen und Endgeräten.
        blocks:
          - type: prose
            paragraphs:
              - >-
                Im Flur ist die Verbindung gut, am Schreibtisch bricht sie ab: Solche Unterschiede
                können durch Wände, Decken, ungünstige Standorte oder benachbarte Funknetze
                entstehen. Wir betrachten die wichtigen Räume und prüfen, wie die vorhandene Technik
                angebunden ist.
              - >-
                Ein Zugangspunkt versorgt einen Bereich mit WLAN. Ein Mesh-System koordiniert
                mehrere Zugangspunkte; sie können untereinander per Funk oder Ethernet verbunden
                sein. Entscheidend sind sowohl die Verbindung zum Endgerät als auch die Anbindung
                des Zugangspunkts an das übrige Netz.
          - type: table
            title: Drei Wege, WLAN im Zuhause zu verteilen
            columns:
              - Ansatz
              - Wann er infrage kommt
              - Worauf es ankommt
            rows:
              - - Router sinnvoll platzieren
                - Die wichtigen Räume liegen nah beieinander; der bisherige Standort ist ungünstig.
                - >-
                  Der Anschluss und mögliche Kabelwege begrenzen, wohin der Router versetzt werden
                  kann.
              - - Mesh oder Repeater per Funk
                - Weitere Räume sollen ohne neue Ethernet-Leitung angebunden werden.
                - >-
                  Der zusätzliche Zugangspunkt braucht selbst eine ausreichend gute Verbindung. Er
                  gehört nicht einfach mitten ins Funkloch.
              - - Zugangspunkt per Ethernet
                - >-
                  Ein entfernter Raum oder eine weitere Etage braucht WLAN; ein Kabelweg ist
                  vorhanden oder machbar.
                - >-
                  Das Kabel übernimmt die Verbindung ins übrige Netz. Standort, Anschlüsse und
                  Stromversorgung werden mitgeplant.
          - type: callout
            tone: quiet
            title: Die vereinbarten Räume und Geräte testen
            body: >-
              Wir richten Mesh-WLAN oder passende Access Points ein und testen die vereinbarten
              Bereiche mit den relevanten Geräten. Eine pauschale Geschwindigkeit oder lückenlose
              Abdeckung lässt sich daraus nicht für jedes Gebäude versprechen.
    - id: netzwerkverkabelung
      kind: explanation
      recipe: explanation.connection-path
      content:
        eyebrow: 02 · Ethernet & Kabelwege
        title: Ethernet und Netzwerkverkabelung
        paragraphs:
          - >-
            Ein fester Schreibtisch, ein Fernseher oder ein NAS muss nicht über Funk verbunden sein.
            Ethernet kann diese Geräte direkt anbinden und zugleich die Basis für einen zusätzlichen
            WLAN-Zugangspunkt schaffen.
          - >-
            Wir planen und verlegen Netzwerkkabel, richten Netzwerkdosen und Anschlüsse ein und
            verbinden die vereinbarten Geräte. Dafür betrachten wir den gesamten Weg: vom Router
            über vorhandene Leitungen oder einen neuen Kabelkanal bis zum tatsächlichen Nutzungsort.
        diagramTitle: Vom Router in die Räume
        caption: >-
          Jeder feste Anschluss braucht eine eigene Leitung und einen Netzwerkport. Das Diagramm
          fasst getrennte Kabelverbindungen zusammen; es zeigt kein einzelnes Kabel, das sich ohne
          weitere Verteilung in mehrere Anschlüsse verzweigt.
        source:
          title: Router / Switch
          body: Für jede vereinbarte feste Verbindung wird ein freier Netzwerkport benötigt.
        route:
          title: Kabelweg & Netzwerkdose
          body: Getrennte Leitungen führen zu den vereinbarten Anschlusspunkten.
        destinations:
          - title: Arbeitsplatz
            body: Computer oder Dockingstation werden direkt angeschlossen.
          - title: WLAN-Zugangspunkt
            body: Das Kabel versorgt einen zusätzlichen Access Point mit der Netzwerkverbindung.
          - title: NAS oder Fernseher
            body: Ein festes Gerät erhält seinen eigenen Anschluss.
        planning:
          title: Der Kabelweg wird vor der Arbeit geklärt.
          body: >-
            Sichtbare Kanäle, vorhandene Leerrohre oder neue Anschlusspunkte haben unterschiedliche
            Voraussetzungen. Wir besprechen den machbaren Weg und den vereinbarten Umfang.
          items:
            - title: Vorhandenes nutzen
              body: >-
                Netzwerkdosen, Leitungen und Verteilung werden geprüft, bevor neue Wege
                vorgeschlagen werden.
            - title: Eingriffe abstimmen
              body: >-
                Bei Bohrungen oder Änderungen an der Wohnung werden notwendige Freigaben vorab
                geklärt. Arbeiten an der Elektroinstallation sind kein Teil dieser Netzwerkleistung.
            - title: Standorte und Anschlüsse prüfen
              body: >-
                Die Dose soll dort liegen, wo Schreibtisch, Fernseher oder Zugangspunkt genutzt
                werden. Wir testen die vereinbarten Verbindungen und erklären die Anschlusspunkte.
    - id: homeoffice
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: 03 · Homeoffice & verbundene Geräte
        title: Verbindungen für Ihr Homeoffice
        intro: >-
          Videokonferenzen, große Dateien und ein gemeinsam genutzter Drucker stellen andere
          Anforderungen als das gelegentliche Surfen auf dem Sofa. Wir planen den Arbeitsplatz nach
          dem, was Sie dort tatsächlich tun.
        blocks:
          - type: columns
            columns:
              - title: Am Schreibtisch
                paragraphs:
                  - >-
                    Wo ein Kabelweg möglich ist, prüfen wir Ethernet für Computer oder
                    Dockingstation. Wo WLAN gebraucht wird, zählt die Verbindung am tatsächlichen
                    Sitzplatz – nicht nur neben dem Router.
              - title: Im übrigen Zuhause
                paragraphs:
                  - >-
                    Drucker, Smart-TV und weitere ausgewählte Geräte werden passend zu ihren
                    Anschlüssen und Funktionen eingebunden. Gemeinsame Nutzung und Erreichbarkeit
                    werden anschließend mit den vorgesehenen Geräten getestet.
          - type: prose
            paragraphs:
              - >-
                Wir betrachten auch die Abhängigkeiten: Eine stockende Besprechung kann am lokalen
                WLAN, am Endgerät, an der Internetleitung oder am verwendeten Dienst liegen. Ein
                besseres Heimnetz behebt nicht automatisch jede dieser Ursachen.
          - type: callout
            tone: outline
            title: Beim Arbeitsgerät gelten die Vorgaben Ihres Arbeitgebers.
            body: >-
              Firmen-VPN, verwaltete Computer und betriebliche Zugriffsregeln stimmen Sie mit Ihrer
              zuständigen IT ab. Wir können die Verbindung zu Hause prüfen; Änderungen an
              verwalteten Geräten benötigen deren Freigabe.
    - id: nas-speicher
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: 04 · NAS & gemeinsame Dateien
        title: NAS und gemeinsame Dateien einrichten
        intro: >-
          Ein NAS ist ein Speichergerät im Netzwerk. Es kann Fotos, Dokumente oder Arbeitsdateien
          für mehrere Geräte bereitstellen, ohne dass ein bestimmter Computer eingeschaltet sein
          muss. Es ist optional; nicht jeder Haushalt benötigt eines.
        blocks:
          - type: prose
            paragraphs:
              - >-
                Wir unterstützen Sie bei Auswahl und Einrichtung eines passenden NAS, binden es ins
                Heimnetz ein und richten die vereinbarten Benutzer und Freigaben ein. Wer welche
                Ordner verwenden soll, wird vorab besprochen und anschließend praktisch geprüft.
          - type: columns
            columns:
              - title: Dateien gemeinsam nutzen
                paragraphs:
                  - >-
                    Computer und andere kompatible Geräte greifen auf die vorgesehenen Freigaben zu.
                    Speicherbedarf und Nutzung entscheiden mit darüber, welche Hardware sinnvoll
                    ist. Ein Fernzugriff ist kein automatisch enthaltener Standard, sondern eine
                    gesondert zu prüfende Anforderung.
              - title: Eine weitere Kopie vorsehen
                paragraphs:
                  - >-
                    Wir besprechen, welche Daten zusätzlich gesichert werden sollen, wohin die
                    Sicherung geht und wie eine Wiederherstellung geprüft werden kann. Ein dafür
                    genutztes zweites Gerät oder ein externer Dienst muss separat eingeplant werden.
          - type: callout
            tone: solid
            title: Ein NAS braucht eine unabhängige Sicherung
            body: >-
              Ein RAID kann je nach Aufbau den Ausfall einer Festplatte abfangen. Es schützt nicht
              automatisch vor versehentlichem Löschen, Schadsoftware oder dem Verlust des ganzen
              Geräts. Ein NAS ersetzt deshalb weder eine unabhängige Sicherung noch eine
              zugesicherte Datenrettung.
    - id: heimnetz-planen
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: 05 · Umzug, Renovierung & Modernisierung
        title: Heimnetz bei Umzug, Renovierung oder Erweiterung planen
        intro: >-
          Ein Umzug ist ein guter Zeitpunkt, das Heimnetz neu zu denken. Aber auch ein über Jahre
          gewachsener Aufbau lässt sich ordnen, ohne alles pauschal auszutauschen.
        blocks:
          - type: columns
            columns:
              - title: Wenn Sie neu planen
                paragraphs:
                  - >-
                    Wo stehen Schreibtische und Fernseher? Wo kommt der Internetanschluss an? Welche
                    Räume sollen später anders genutzt werden? Wenn Leitungen und Anschlusspunkte
                    früh mitgedacht werden, bleiben mehr Möglichkeiten für WLAN, Speicher und feste
                    Geräte.
              - title: Wenn schon vieles vorhanden ist
                paragraphs:
                  - >-
                    Wir sichten Router, Repeater, Switches und bestehende Kabelwege. Danach lässt
                    sich entscheiden, was bleiben kann, was anders konfiguriert werden sollte und wo
                    eine gezielte Ergänzung mehr bringt als ein weiterer Einzelkauf.
          - type: prose
            paragraphs:
              - >-
                Auf Wunsch empfehlen und beschaffen wir geeignete Netzwerk- und Speicherhardware.
                Zusätzliche Geräte, Arbeiten oder weitere Termine werden mit Ihnen abgestimmt. Auch
                eine Umsetzung in sinnvollen Schritten kann vereinbart werden.
    - id: ablauf
      kind: process
      recipe: process.staged-path
      content:
        eyebrow: So gehen wir vor
        title: So planen und installieren wir Ihr Heimnetz
        intro: >-
          Sie beschreiben Ihr Vorhaben. Wir klären, welche Unterstützung sinnvoll ist und was vor
          einem Termin vereinbart werden muss.
        steps:
          - title: Bedarf klären
            body: >-
              Räume, Geräte, gewünschte Nutzung und vorhandene Anschlüsse geben den Ausgangspunkt.
              Das erste Gespräch ist kostenlos.
          - title: Prüfen & vereinbaren
            body: >-
              Wir betrachten den Aufbau und schlagen passende Maßnahmen vor. Umfang und Kosten sowie
              ein gegebenenfalls kostenpflichtiger Diagnosebesuch werden vorab geklärt.
          - title: Aufbauen & einrichten
            body: >-
              Die vereinbarten Kabel, Zugangspunkte, Speicher und Geräte werden installiert und
              konfiguriert. Zusätzliche Arbeit wird vorher abgestimmt.
          - title: Testen & übergeben
            body: >-
              Wir prüfen die vereinbarten Bereiche, Anschlüsse und Speicherzugriffe mit Ihnen und
              erklären den Aufbau, wichtige Einstellungen und verbleibende Grenzen.
    - id: fragen
      kind: faq
      recipe: faq.editorial-answers
      content:
        eyebrow: Vor der Anfrage
        title: Häufige Fragen zum Heimnetz
        intro: >-
          Sie brauchen keinen fertigen Netzplan. Diese Antworten helfen, das Vorhaben und die
          nächsten Schritte einzuordnen.
        items:
          - question: Muss mein vorhandener Router ersetzt werden?
            paragraphs:
              - >-
                Oft kann er bleiben. Wir prüfen Anschlüsse, Einstellungen und die Kompatibilität mit
                dem geplanten Aufbau. Ein anderer Standort oder ein zusätzlicher Zugangspunkt kann
                genügen. Vorgaben für Geräte des Internetanbieters berücksichtigen wir; auf Wunsch
                beschaffen wir abgestimmte Hardware.
          - question: Können Sie Ethernet in einer bewohnten Wohnung verlegen?
            paragraphs:
              - >-
                Häufig kommen vorhandene Leerrohre oder sichtbare Kabelkanäle infrage. Wir prüfen
                den machbaren Weg und besprechen notwendige Freigaben sowie bauliche Nacharbeiten
                vor Beginn. Änderungen an der Elektroinstallation gehören nicht zur
                Netzwerkleistung.
          - question: Was kostet die Einrichtung und wann ist ein Termin möglich?
            paragraphs:
              - >-
                Wir erstellen ein individuelles Angebot nach vorhandener Technik, Räumen und
                Arbeitsumfang. Das erste Gespräch ist kostenlos; eine kostenpflichtige Diagnose vor
                Ort erklären wir vorab. Termine, auch mögliche Abende oder Samstage, werden
                persönlich vereinbart. Eine feste Reaktionszeit sagen wir nicht zu.
          - question: Wird WLAN in jedem Raum gleich gut funktionieren?
            paragraphs:
              - >-
                Nicht unbedingt. Wir planen und testen die vereinbarten Nutzungsorte, aber Wände,
                Störungen und Geräteeigenschaften beeinflussen das Ergebnis. Bleiben Grenzen,
                erklären wir, ob ein anderer Standort, ein weiterer Zugangspunkt oder eine
                Kabelverbindung helfen könnte.
          - question: Was ist bei einer Störung des Internetanbieters?
            paragraphs:
              - >-
                Wir können eingrenzen, ob das Problem im Heimnetz oder an der ankommenden Verbindung
                liegt. Störungen im Netz des Internetanbieters oder an dessen Anschluss müssen vom
                Anbieter bearbeitet werden; deren Reparatur ist nicht Teil unserer Heimnetzleistung.
          - question: Kann ein NAS auch meinen Computer sichern?
            paragraphs:
              - >-
                Je nach Gerät und Software lässt sich eine Computersicherung auf dem NAS einrichten.
                Wir klären Umfang, Kompatibilität und den Wiederherstellungsweg. Dateien, deren
                einzige Kopie auf dem NAS liegt, brauchen trotzdem eine unabhängige Sicherung.
                Beschädigte oder unlesbare Datenträger sind keine normale Einrichtungsaufgabe.
