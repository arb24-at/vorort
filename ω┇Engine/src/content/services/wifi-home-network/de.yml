        title: Heimnetz-Anfrage stellen
        intro: >-
          Was funktioniert nicht oder soll neu eingerichtet werden? Ihr Berliner Stadtteil,
          betroffene Räume und vorhandene Geräte helfen uns bei der Einordnung.
        formIntro: >-
          Das Formular erstellt einen Entwurf in Ihrem E-Mail-Programm. Prüfen und senden Sie ihn
          dort selbst; die Website versendet nichts direkt. * Pflichtfelder.
        request: Was möchten Sie einrichten oder verbessern?
        requestPlaceholder: >-
          Zum Beispiel: Das WLAN funktioniert im Wohnzimmer, bricht aber am Schreibtisch im
          Schlafzimmer ab. Ich nutze den Router meines Anbieters und wohne in Neukölln. Bitte keine
          Passwörter oder Zugangscodes senden.
        affectedPlaceholder: Zum Beispiel Router, WLAN im Schlafzimmer oder Homeoffice-Verbindung
        emailSubject: Heimnetz-Anfrage aus Berlin
    - id: themen
      kind: scope
      recipe: scope.topic-index
      content:
        eyebrow: Mehr zum Leistungsumfang
        title: WLAN, Kabel und Speicher im Überblick
        intro: >-
          Vielleicht fehlt die Verbindung in einem Zimmer. Vielleicht planen Sie alles neu. Die
          folgenden Themen zeigen, was wir gemeinsam betrachten und einrichten können.
        items:
          - title: WLAN & Mesh
            body: Funkabdeckung verbessern und Zugangspunkte sinnvoll platzieren.
            target: wlan-mesh
            media:
              subject: wifi
              src: /images/concept-ii/private/P2.png
              alt: >-
                Illustration zweier Wohnbereiche mit einem WLAN-Zugangspunkt und angedeutetem
