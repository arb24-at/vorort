        title: Heimnetzwerk einrichten in Berlin
        intro: >-
          Wir helfen bei schwachem WLAN, einem neuen Router und Verbindungen fürs Homeoffice. Ob ein
          Gerät, ein Zimmer oder ein ganzes Heimnetz: Wir prüfen Ihre vorhandene Technik und
          besprechen passende Änderungen, bevor Sie neue Geräte kaufen.
