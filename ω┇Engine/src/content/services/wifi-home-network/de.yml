    - id: wlan-mesh
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "01 · WLAN & Mesh"
        title: "Gutes WLAN beginnt mit dem richtigen Standort."
        intro: "Ein neuer Router allein löst nicht jede Funklücke. Wenn Sie die WLAN-Reichweite verbessern möchten, zählen vor allem die Wege zwischen Zugangspunkt, Räumen und Endgeräten."
        blocks:
          - type: prose
            paragraphs:
              - "Im Flur ist die Verbindung gut, am Schreibtisch bricht sie ab: Solche Unterschiede können durch Wände, Decken, ungünstige Standorte oder benachbarte Funknetze entstehen. Wir betrachten die wichtigen Räume und prüfen, wie die vorhandene Technik angebunden ist."
              - "Oft lässt sich ein bestehendes Heimnetz gezielt verbessern. Ob dafür ein anderer Standort, ein zusätzlicher Zugangspunkt oder eine Kabelverbindung sinnvoll ist, entscheidet sich am Gebäude und an Ihrer Nutzung. Vorhandene Hardware wird dabei mitgeprüft."
          - type: subheading
            emphasis: band
            title: "Mesh beschreibt das Zusammenspiel. Die Verbindung bleibt entscheidend."
            body: "Ein Mesh-Netzwerk kann Zugangspunkte per Funk oder per Netzwerkkabel verbinden. Auch ein kabelgebundener Access Point kann Teil eines Mesh-Systems sein."
          - type: table
            title: "Drei Wege, WLAN im Zuhause zu verteilen"
            columns: ["Ansatz", "Wann er infrage kommt", "Worauf es ankommt"]
            rows:
              - ["Router sinnvoll platzieren", "Die wichtigen Räume liegen nah beieinander; der bisherige Standort ist ungünstig.", "Der Anschluss und mögliche Kabelwege begrenzen, wohin der Router versetzt werden kann."]
              - ["Mesh oder Repeater per Funk", "Weitere Räume sollen ohne neue Ethernet-Leitung angebunden werden.", "Der zusätzliche Zugangspunkt braucht selbst eine ausreichend gute Verbindung. Er gehört nicht einfach mitten ins Funkloch."]
              - ["Zugangspunkt per Ethernet", "Ein entfernter Raum oder eine weitere Etage braucht WLAN; ein Kabelweg ist vorhanden oder machbar.", "Das Kabel übernimmt die Verbindung ins übrige Netz. Standort, Anschlüsse und Stromversorgung werden mitgeplant."]
          - type: callout
            tone: quiet
            title: "Dort prüfen, wo Sie das Netz nutzen."
            body: "Wir richten Mesh-WLAN oder passende Access Points ein und testen die vereinbarten Bereiche mit den relevanten Geräten. Eine pauschale Geschwindigkeit oder lückenlose Abdeckung lässt sich daraus nicht für jedes Gebäude versprechen."
    - id: netzwerkverkabelung
      kind: explanation
      recipe: explanation.connection-path
      content:
        eyebrow: "02 · Ethernet & Kabelwege"
        title: "Ein Kabel kann dem WLAN den Weg erleichtern."
        paragraphs:
          - "Ein fester Schreibtisch, ein Fernseher oder ein NAS muss nicht über Funk verbunden sein. Ethernet kann diese Geräte direkt anbinden und zugleich die Basis für einen zusätzlichen WLAN-Zugangspunkt schaffen."
          - "Wir planen und verlegen Netzwerkkabel, richten Netzwerkdosen und Anschlüsse ein und verbinden die vereinbarten Geräte. Dafür betrachten wir den gesamten Weg: vom Router über vorhandene Leitungen oder einen neuen Kabelkanal bis zum tatsächlichen Nutzungsort."
        diagramTitle: "Vom Router in die Räume"
        caption: "Vereinfachtes Beispiel: Je nach Aufbau verteilen ein Switch und mehrere Leitungen die Anschlüsse. Ein Kabelweg allein versorgt nicht beliebig viele Geräte ohne passende Verteilung."
        source:
          title: "Router / Switch"
          body: "Hier werden die lokalen Verbindungen zusammengeführt und bei Bedarf auf zusätzliche Anschlüsse verteilt."
        route:
          title: "Kabelweg & Netzwerkdose"
          body: "Eine passende Leitung bringt das Netz an den vorgesehenen Ort."
        destinations:
          - title: "Arbeitsplatz"
            body: "Computer oder Dockingstation werden direkt angeschlossen."
          - title: "WLAN-Zugangspunkt"
            body: "Das Kabel versorgt einen zusätzlichen Access Point mit der Netzwerkverbindung."
          - title: "NAS oder Fernseher"
            body: "Ein festes Gerät erhält seinen eigenen Anschluss."
        planning:
          title: "Der Kabelweg wird vor der Arbeit geklärt."
          body: "Sichtbare Kanäle, vorhandene Leerrohre oder neue Anschlusspunkte haben unterschiedliche Voraussetzungen. Wir besprechen den machbaren Weg und den vereinbarten Umfang."
          items:
            - title: "Vorhandenes nutzen"
              body: "Netzwerkdosen, Leitungen und Verteilung werden geprüft, bevor neue Wege vorgeschlagen werden."
            - title: "Eingriffe abstimmen"
              body: "Bei Bohrungen oder Änderungen an der Wohnung werden notwendige Freigaben vorab geklärt. Arbeiten an der Elektroinstallation sind kein Teil dieser Netzwerkleistung."
            - title: "Anschlüsse prüfen"
              body: "Die vereinbarten Verbindungen werden praktisch getestet und die Übergabepunkte nachvollziehbar erklärt."
    - id: homeoffice
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "03 · Homeoffice & verbundene Geräte"
        title: "Der Arbeitsplatz verdient einen festen Platz im Netzplan."
        intro: "Videokonferenzen, große Dateien und ein gemeinsam genutzter Drucker stellen andere Anforderungen als das gelegentliche Surfen auf dem Sofa. Wir planen den Arbeitsplatz nach dem, was Sie dort tatsächlich tun."
        blocks:
          - type: columns
            columns:
              - title: "Am Schreibtisch"
                paragraphs:
                  - "Wo ein Kabelweg möglich ist, prüfen wir Ethernet für Computer oder Dockingstation. Wo WLAN gebraucht wird, zählt die Verbindung am tatsächlichen Sitzplatz – nicht nur neben dem Router."
              - title: "Im übrigen Zuhause"
                paragraphs:
                  - "Drucker, Smart-TV und weitere ausgewählte Geräte werden passend zu ihren Anschlüssen und Funktionen eingebunden. Gemeinsame Nutzung und Erreichbarkeit werden anschließend mit den vorgesehenen Geräten getestet."
          - type: prose
            paragraphs:
              - "Wir betrachten auch die Abhängigkeiten: Eine stockende Besprechung kann am lokalen WLAN, am Endgerät, an der Internetleitung oder am verwendeten Dienst liegen. Ein besseres Heimnetz behebt nicht automatisch jede dieser Ursachen."
          - type: callout
            tone: outline
            title: "Beim Arbeitsgerät gelten die Vorgaben Ihres Arbeitgebers."
            body: "Firmen-VPN, verwaltete Computer und betriebliche Zugriffsregeln stimmen Sie mit Ihrer zuständigen IT ab. Wir können die Netzwerkbasis zu Hause prüfen, ohne fremde Verwaltungs- oder Sicherheitsvorgaben zu umgehen. Umfangreiche Smart-Home-Installationen werden separat geplant."
    - id: nas-speicher
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "04 · NAS & gemeinsame Dateien"
        title: "Ein Ort für Ihre Dateien. Ein eigener Plan für die Sicherung."
        intro: "Ein NAS ist ein Speichergerät im Netzwerk. Es kann Fotos, Dokumente oder Medien für mehrere Geräte bereitstellen. Damit es im Alltag hilft, müssen Speicher, Benutzer und Datenwege zusammenpassen."
        blocks:
          - type: prose
            paragraphs:
              - "Wir unterstützen Sie bei Auswahl und Einrichtung eines passenden NAS, binden es ins Heimnetz ein und richten die vereinbarten Benutzer und Freigaben ein. Wer welche Ordner verwenden soll, wird vorab besprochen und anschließend praktisch geprüft."
          - type: subheading
            emphasis: plain
            title: "Zugriff und Sicherung sind zwei verschiedene Aufgaben."
          - type: columns
            columns:
              - title: "Dateien gemeinsam nutzen"
                paragraphs:
                  - "Computer und andere kompatible Geräte greifen auf die vorgesehenen Freigaben zu. Speicherbedarf und Nutzung entscheiden mit darüber, welche Hardware sinnvoll ist. Ein Fernzugriff ist kein automatisch enthaltener Standard, sondern eine gesondert zu prüfende Anforderung."
              - title: "Eine weitere Kopie vorsehen"
                paragraphs:
                  - "Wir besprechen, welche Daten zusätzlich gesichert werden sollen, wohin die Sicherung geht und wie eine Wiederherstellung geprüft werden kann. Ein dafür genutztes zweites Gerät oder ein externer Dienst muss separat eingeplant werden."
          - type: callout
            tone: solid
            title: "Auch mehrere Festplatten sind noch kein vollständiges Backup."
            body: "Ein RAID kann je nach Aufbau den Ausfall einer Festplatte abfangen. Es schützt nicht automatisch vor versehentlichem Löschen, Schadsoftware oder dem Verlust des ganzen Geräts. Ein NAS ersetzt deshalb weder eine unabhängige Sicherung noch eine zugesicherte Datenrettung."
    - id: heimnetz-planen
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "05 · Umzug, Renovierung & Modernisierung"
        title: "Erst die Räume. Dann die Einkaufsliste."
        intro: "Ein Umzug ist ein guter Zeitpunkt, das Heimnetz neu zu denken. Aber auch ein über Jahre gewachsener Aufbau lässt sich ordnen, ohne alles pauschal auszutauschen."
        blocks:
          - type: columns
            columns:
              - title: "Wenn Sie neu planen"
                paragraphs:
                  - "Wo stehen Schreibtische und Fernseher? Wo kommt der Internetanschluss an? Welche Räume sollen später anders genutzt werden? Wenn Leitungen und Anschlusspunkte früh mitgedacht werden, bleiben mehr Möglichkeiten für WLAN, Speicher und feste Geräte."
              - title: "Wenn schon vieles vorhanden ist"
                paragraphs:
                  - "Wir sichten Router, Repeater, Switches und bestehende Kabelwege. Danach lässt sich entscheiden, was bleiben kann, was anders konfiguriert werden sollte und wo eine gezielte Ergänzung mehr bringt als ein weiterer Einzelkauf."
          - type: prose
            paragraphs:
              - "Auf Wunsch empfehlen und beschaffen wir geeignete Netzwerk- und Speicherhardware. Zusätzliche Geräte, Arbeiten oder weitere Termine werden mit Ihnen abgestimmt. Auch eine Umsetzung in sinnvollen Schritten kann vereinbart werden."
          - type: callout
            tone: quiet
            title: "Für die erste Anfrage reicht ein Überblick."
            body: "Hilfreich sind ungefähre Wohnfläche, Anzahl der Räume oder Etagen, Bezirk, wichtige Geräte und vorhandene Netzwerkanschlüsse. Einen Grundriss oder Fotos können wir bei Bedarf später besprechen. Zugangsdaten gehören nicht in die Anfrage."
    - id: ablauf
      kind: process
      recipe: process.staged-path
      content:
        eyebrow: "So gehen wir vor"
        title: "Vom ersten Gespräch bis zum geprüften Anschluss."
        intro: "Sie beschreiben Ihr Vorhaben. Wir klären, welche Unterstützung sinnvoll ist und was vor einem Termin vereinbart werden muss."
        steps:
          - title: "Bedarf klären"
            body: "Räume, Geräte, gewünschte Nutzung und vorhandene Anschlüsse geben den Ausgangspunkt. Das erste Gespräch ist kostenlos."
          - title: "Prüfen & vereinbaren"
            body: "Wir betrachten den Aufbau und schlagen passende Maßnahmen vor. Umfang und Kosten sowie ein gegebenenfalls kostenpflichtiger Diagnosebesuch werden vorab geklärt."
          - title: "Aufbauen & einrichten"
            body: "Die vereinbarten Kabel, Zugangspunkte, Speicher und Geräte werden installiert und konfiguriert. Zusätzliche Arbeit wird vorher abgestimmt."
          - title: "Testen & übergeben"
            body: "Wir prüfen die vereinbarten Bereiche, Anschlüsse und Speicherzugriffe mit Ihnen und erklären den Aufbau, wichtige Einstellungen und verbleibende Grenzen."
    - id: fragen
      kind: faq
      recipe: faq.editorial-answers
      content:
        eyebrow: "Vor der Anfrage"
        title: "Was Sie noch wissen möchten."
        intro: "Sie brauchen keinen fertigen Netzplan. Diese Antworten helfen, das Vorhaben und die nächsten Schritte einzuordnen."
        items:
          - question: "Muss mein vorhandener Router ersetzt werden?"
            paragraphs:
              - "Nicht grundsätzlich. Wir prüfen, welche Funktionen und Anschlüsse vorhanden sind und ob sich der Router sinnvoll weiterverwenden lässt. Ein anderer Standort, ein zusätzlicher Access Point oder eine bessere Verbindung kann genügen."
              - "Neue Hardware wird erst empfohlen, wenn die Anforderungen und die vorhandenen Möglichkeiten geklärt sind. Auf Wunsch können wir geeignete Komponenten auch beschaffen."
          - question: "Können Sie Netzwerkkabel auch in einer bestehenden Wohnung verlegen?"
            paragraphs:
              - "Ja. Wir können Kabelwege, Netzwerkdosen und Anschlüsse planen und die vereinbarten Netzwerkarbeiten umsetzen. Welche Verlegung machbar ist, hängt von der Wohnung, vorhandenen Wegen und erforderlichen Freigaben ab."
              - "Bauliche Nacharbeiten werden bei Bedarf gesondert abgestimmt; Änderungen an der Elektroinstallation gehören nicht zu dieser Leistung. Auch ohne Renovierung kann ein geeigneter sichtbarer Kabelkanal eine Möglichkeit sein."
          - question: "Was kostet die Einrichtung und wann ist ein Termin möglich?"
            paragraphs:
              - "Der Aufwand richtet sich nach Räumen, vorhandener Technik, Kabelwegen und dem gewünschten Umfang. Wir erstellen deshalb ein individuelles Angebot. Das erste Gespräch ist kostenlos; Kosten für einen notwendigen Diagnosebesuch werden vorher erklärt."
              - "Termine werden persönlich vereinbart. Je nach Absprache kommen auch Abende oder Samstage infrage. Eine feste Reaktionszeit oder einen kurzfristigen Termin können wir nicht pauschal zusagen."
          - question: "Können Sie WLAN in jedem Raum garantieren?"
            paragraphs:
              - "Eine solche Zusage wäre ohne Kenntnis des Gebäudes nicht seriös. Wände, Decken, andere Funknetze, Geräteeigenschaften und mögliche Kabelwege beeinflussen das Ergebnis."
              - "Wir planen für die vereinbarten Nutzungsorte und prüfen sie nach der Einrichtung. Dabei erklären wir auch, wo Grenzen bleiben oder welche weitere Maßnahme sinnvoll wäre."
          - question: "Helfen Sie auch, wenn die Internetleitung gestört ist?"
            paragraphs:
              - "Wir können prüfen, ob die Ursache wahrscheinlich im lokalen Heimnetz oder außerhalb davon liegt. Ein Problem am Router oder an der Verbindung zum Arbeitsplatz ist etwas anderes als eine Störung der Anschlussleitung."
              - "Störungen im Netz des Internetanbieters oder an dessen Anschluss müssen vom Anbieter bearbeitet werden. Eine solche Reparatur gehört nicht zu unserem Heimnetz-Angebot."
          - question: "Kann mein NAS auch die Sicherung meiner Computer übernehmen?"
            paragraphs:
              - "Je nach NAS, Betriebssystem und verwendeter Software lässt sich eine Computersicherung auf dem NAS einrichten. Wir klären dafür Umfang, Kompatibilität und den vorgesehenen Wiederherstellungsweg."
              - "Dateien, deren einzige Kopie auf dem NAS liegt, sind dadurch noch nicht unabhängig gesichert. Für wichtige Daten sollte eine weitere, passend getrennte Kopie eingeplant werden. Beschädigte oder unlesbare Datenträger sind keine normale Einrichtungsaufgabe."
