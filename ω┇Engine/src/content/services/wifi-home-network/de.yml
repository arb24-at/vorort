    - id: alltagssituationen
      kind: recognition
      recipe: recognition.situations
      content:
        eyebrow: Typische Anlässe
        title: Wobei benötigen Sie Unterstützung im Heimnetz?
        intro: >-
          Beschreiben Sie, was nicht funktioniert und in welchen Räumen Sie es bemerken. Sie müssen
          weder die Ursache kennen noch fertige Geräteempfehlungen mitbringen.
        items:
          - title: Das WLAN erreicht nicht alle Räume
            body: >-
              Neben dem Router klappt der Videoanruf, am Schreibtisch oder im Schlafzimmer bricht er
              ab. Wir prüfen die Verbindung dort, wo Sie sie nutzen.
          - title: Ein neuer Router soll eingerichtet werden
            body: >-
              Wir helfen beim Anschluss und verbinden Ihre Geräte. Dabei berücksichtigen wir den
              Internetanbieter und Technik, die Sie weiterverwenden möchten.
          - title: Besprechungen im Homeoffice brechen ab
            body: >-
              Wir prüfen die Verbindung am Arbeitsplatz, einschließlich Computer, Dock oder Adapter,
              und ob WLAN oder Ethernet besser zur Situation passt.
          - title: Drucker oder Fernseher verbinden sich nicht
            body: >-
              Wir prüfen die unterstützten Anschlüsse und Einstellungen und binden kompatible Geräte
              ins Heimnetz ein.
          - title: Sie ziehen um oder verändern die Wohnung
            body: >-
              Wir planen nach den künftigen Standorten von Router, Möbeln und Geräten und beziehen
              nutzbare Anschlüsse und Kabelwege ein.
    - id: praktische-hilfe
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: Was wir übernehmen
        title: Vorhandenes prüfen und passende Änderungen besprechen
        intro: >-
          Manchmal genügen andere Einstellungen, ein besserer Routerstandort oder ein zusätzlicher
          Anschluss. Diese Möglichkeiten prüfen wir, bevor wir neue Hardware empfehlen.
        blocks:
          - type: columns
            columns:
              - title: Hilfe bei einem einzelnen Problem
                paragraphs:
                  - >-
                    Wir richten einen Router ein, verbinden Geräte oder untersuchen schwaches WLAN
                    in einem bestimmten Zimmer. Auch kleine Aufträge sind willkommen; Sie brauchen
                    keinen Plan für das ganze Zuhause.
              - title: Ein neues oder erweitertes Heimnetz
                paragraphs:
                  - >-
                    Wir können WLAN, Ethernet-Anschlüsse und gemeinsamen Speicher zusammen planen
                    und einrichten. Geräte und Arbeiten stimmen wir mit Ihnen ab; auf Wunsch
                    beschaffen wir passende Hardware.
          - type: callout
            tone: quiet
            title: Kosten vorab klären
            body: >-
              Wir erstellen individuelle Angebote. Eine kostenpflichtige Diagnose vor Ort erläutern
              wir vor der Terminvereinbarung; zusätzliche Geräte oder Arbeiten werden vorher mit
              Ihnen besprochen.
    - id: kurzer-kontakt
      kind: cta
      recipe: cta.quick-contact
      content:
        eyebrow: Kontakt aufnehmen
        title: Beschreiben Sie uns Ihr Anliegen
        body: >-
          Das erste Gespräch ist kostenlos. Rufen Sie uns an oder schildern Sie das Problem unten im
          Formular.
        callLabel: Heimnetz-Anliegen telefonisch besprechen
        enquiryLabel: Anfrageformular verwenden
        enquiryTarget: kontakt
    - id: kontakt
      kind: contact
      recipe: contact.enquiry-email
