outcome:
  eyebrow: "Know your setup"
  title: "Useful connections, clearly explained"
  text: "We test the agreed locations and devices with you, explain how the setup fits together and point out any remaining limits. You know what has changed and which settings matter for everyday use."
cta:
  title: "Tell us what should work better."
  text: "One room, a new router or a larger plan: a few lines are enough to begin. The first conversation is free. We agree the work and costs with you, including any charge for a necessary diagnostic visit, before going ahead."
  prompt: "For example: Wi-Fi works in the living room but drops at my desk in the bedroom. I have the provider’s router and live in Neukölln. Please leave out passwords and access codes."
