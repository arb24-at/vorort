    - id: wifi-coverage
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "01 · Wi-Fi & Mesh"
        title: "Wi-Fi setup starts with where you need the signal."
        intro: "A new router will not solve every dead zone. Good Wi-Fi installation takes account of the rooms, the devices and how each access point connects to the rest of the network."
        blocks:
          - type: prose
            paragraphs:
              - "A connection that works in the hallway may struggle at the desk. Walls, floors, equipment positions and neighbouring wireless networks can all make a difference. We look at the rooms that matter to you and check how the existing equipment is connected."
              - "An improvement does not always mean replacing the whole setup. Moving equipment, adding an access point or providing a wired link may be enough. We check what you already have before recommending changes."
          - type: subheading
            emphasis: band
            title: "Mesh coordinates the access points. Their connection still matters."
            body: "Mesh Wi-Fi setup can use wireless links or Ethernet between access points. A wired access point can also belong to a Mesh system; these are not mutually exclusive choices."
          - type: table
            title: "Three ways to extend Wi-Fi through a home"
            columns: ["Approach", "When it may fit", "What to consider"]
            rows:
              - ["Reposition the router", "The important rooms are reasonably close, but the current router position is unhelpful.", "The incoming connection and available cable routes limit where the router can go."]
              - ["Connect Mesh nodes or repeaters wirelessly", "More rooms need coverage without installing a new Ethernet run.", "The added access point needs a good connection of its own. Placing it in the dead zone can leave the original problem in place."]
              - ["Connect an access point by Ethernet", "A distant room or another floor needs Wi-Fi, and a cable route exists or can be installed.", "Ethernet carries the connection back to the network. Equipment position, outlets and power still need planning."]
          - type: callout
            tone: quiet
            title: "Test the connection where it will actually be used."
            body: "We configure suitable Mesh equipment or access points and test the agreed areas with the relevant devices. The building and equipment still set limits: we do not promise a particular speed or blanket coverage in every property."
    - id: ethernet-cabling
      kind: explanation
      recipe: explanation.connection-path
      content:
        eyebrow: "02 · Ethernet & network cabling"
        title: "Ethernet installation brings the network to the room."
        paragraphs:
          - "Home network cabling can give a fixed desk, TV or NAS its own wired connection. It can also provide the link for another Wi-Fi access point, so wireless coverage does not depend on a weak signal reaching that room."
          - "We plan and install Ethernet cabling, network outlets and the agreed connections to your devices. The route is considered from end to end: from the router, through existing wiring or a new cable channel, to the place where the connection is needed."
        diagramTitle: "From the router to the rooms"
        caption: "A simplified example: a switch and separate cable runs may distribute the connections. One cable route does not give an unlimited number of devices their own connection without the right distribution equipment."
        source:
          title: "Router / switch"
          body: "Local connections come together here, with extra ports provided where needed."
        route:
          title: "Cable route & network outlet"
          body: "A suitable cable carries the network connection to the intended location."
        destinations:
          - title: "Workstation"
            body: "A computer or docking station connects directly."
          - title: "Wi-Fi access point"
            body: "Ethernet links an additional access point to the rest of the network."
          - title: "NAS or TV"
            body: "A fixed device has its own network connection."
        planning:
          title: "Agree the cable route before installation."
          body: "Existing conduits, visible cable channels and new outlet positions each have different requirements. We discuss what is practical and agree the work before it starts."
          items:
            - title: "Check what is already there"
              body: "Existing network outlets, cables and distribution points are checked before new routes are proposed."
            - title: "Agree any alterations"
              body: "Drilling or changes to the property need the relevant permission in advance. Work on electrical wiring is outside this network service."
            - title: "Test the connections"
              body: "We test the agreed links in practice and explain the connection points at handover."
    - id: home-office
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "03 · Home office & connected devices"
        title: "Home office network setup starts at the desk."
        intro: "Video calls, large files and a shared printer make different demands from occasional browsing on the sofa. We plan the work-area connection around what you need to do there."
        blocks:
          - type: columns
            columns:
              - title: "At your workstation"
                paragraphs:
                  - "Where a cable route is practical, we consider Ethernet for the computer or docking station. Where you need Wi-Fi, we check the connection at your working position, rather than only beside the router."
              - title: "Around the home"
                paragraphs:
                  - "Printers, Smart TVs and other selected devices are connected according to their ports and supported features. We then check access and shared use with the devices you intend to use."
          - type: prose
            paragraphs:
              - "We also look at the dependencies. A video call can struggle because of the local Wi-Fi, the computer, the internet connection or the meeting service. Improving the home network does not automatically fix every part of that chain."
          - type: callout
            tone: outline
            title: "Employer-managed equipment stays under your employer’s rules."
            body: "Your employer’s IT team remains responsible for its VPN, managed computers and access policies. We can check the network at home without bypassing those controls. Larger smart-home installations are scoped separately."
    - id: nas-storage
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "04 · NAS & shared files"
        title: "NAS setup: shared files, with backup planned separately."
        intro: "A NAS puts shared storage on your network, making photos, documents or media available to several devices. The storage, user access and network connections need to work together."
        blocks:
          - type: prose
            paragraphs:
              - "We help you choose and configure suitable NAS hardware, connect it to the home network and set up the agreed users and shared folders. We discuss who should have access to which files, then test those permissions in practice."
          - type: subheading
            emphasis: plain
            title: "Sharing files and protecting a copy are different jobs."
          - type: columns
            columns:
              - title: "Make files available"
                paragraphs:
                  - "Computers and other compatible devices use the intended shared folders. Storage needs and everyday use help determine suitable equipment. Remote access is a separate requirement to assess, rather than an automatic part of the setup."
              - title: "Keep another copy"
                paragraphs:
                  - "We discuss which data needs another copy, where that backup should be kept and how a restore can be checked. A second device or an external service used for this needs to be planned separately."
          - type: callout
            tone: solid
            title: "Several drives do not automatically make a complete backup."
            body: "Depending on the configuration, RAID can help a NAS cope with a drive failure. It does not automatically protect against accidental deletion, malware or loss of the entire device. A NAS does not replace an independent backup, and its installation is not a promise of data recovery."
    - id: network-planning
      kind: explanation
      recipe: explanation.editorial-prose
      content:
        eyebrow: "05 · Moving, renovating & upgrading"
        title: "Plan the rooms before buying the equipment."
        intro: "Moving home is a useful opportunity to rethink the network. An existing setup that has grown over the years can also be put in order without replacing everything."
        blocks:
          - type: columns
            columns:
              - title: "For a new installation"
                paragraphs:
                  - "Where will the desks and TVs go? Where does the internet connection enter the property? Could a room be used differently later? Thinking about cable routes and outlets early leaves more options for Wi-Fi, storage and fixed devices."
              - title: "For the network you already have"
                paragraphs:
                  - "We review the router, repeaters, switches and cable routes. That gives us a basis for deciding what can stay, what needs reconfiguring and where a targeted addition would help more than another unplanned purchase."
          - type: prose
            paragraphs:
              - "If requested, we can recommend and supply suitable network and storage hardware. Extra equipment, work or further visits are agreed with you before proceeding. The installation can also be divided into practical stages."
          - type: callout
            tone: quiet
            title: "A brief overview is enough for the first enquiry."
            body: "Mention the approximate property size, rooms or floors, Berlin district, important devices and any network outlets. We can discuss a floor plan or photos later if useful. Do not send passwords or access codes with the enquiry."
    - id: installation
      kind: process
      recipe: process.staged-path
      content:
        eyebrow: "How we work"
        title: "Home network installation, from first call to handover."
        intro: "Start with what you want to connect or improve. We clarify the help you need and what must be agreed before arranging a visit."
        steps:
          - title: "Understand the need"
            body: "We discuss the rooms, devices, intended use and existing connections. The initial conversation is free."
          - title: "Assess & agree"
            body: "We review the setup and propose suitable work. Scope, costs and any charge for a necessary diagnostic visit are explained in advance."
          - title: "Install & configure"
            body: "The agreed cables, access points, storage and devices are installed and configured. Any additional work is discussed before it goes ahead."
          - title: "Test & hand over"
            body: "We check the agreed areas, connections and storage access with you, then explain the layout, important settings and any remaining limitations."
    - id: questions
      kind: faq
      recipe: faq.editorial-answers
      content:
        eyebrow: "Before you get in touch"
        title: "A few practical questions, answered."
        intro: "You do not need a finished network plan. These answers explain what to expect and help you describe the project."
        items:
          - question: "Will I need a new router?"
            paragraphs:
              - "Not necessarily. We check the ports and features already available and whether the router can remain part of the setup. A different position, another access point or a better connection between devices may be enough."
              - "We recommend new equipment only after understanding the requirements and existing options. If you prefer, we can also supply the agreed components."
          - question: "Can you install network cabling in an existing apartment?"
            paragraphs:
              - "Yes. We can plan cable routes, network outlets and connection points, then carry out the agreed installation. What is practical depends on the property, existing routes and any permissions needed."
              - "Making-good around cable routes is discussed separately where required; electrical wiring is outside this service. A suitable surface-mounted cable channel may be an option even when you are not renovating."
          - question: "What does home network installation cost, and when can you visit?"
            paragraphs:
              - "The work depends on the rooms, existing equipment, cable routes and agreed scope, so we provide an individual quotation. The initial conversation is free. Any charge for a necessary diagnostic visit is explained beforehand."
              - "Appointments are arranged individually. Evenings or Saturdays may be possible by agreement, but we cannot promise a particular response time or a short-notice appointment."
          - question: "Can you guarantee Wi-Fi coverage in every room?"
            paragraphs:
              - "A blanket promise would overlook the property itself. Walls, floors, neighbouring networks, device capabilities and possible cable routes all affect the result."
              - "We plan for the agreed locations and test them after setup. We also explain remaining limits and any further work that could help."
          - question: "What if the fault is with my internet provider?"
            paragraphs:
              - "We can help establish whether the cause is likely inside the home network or beyond it. A router or work-area connection problem is different from a fault on the incoming line."
              - "Faults in the provider’s network or on its connection must be handled by the provider. Repairing that infrastructure is outside our home network service."
          - question: "Can a NAS back up my computers as well?"
            paragraphs:
              - "Depending on the NAS, operating system and software, computer backups can be configured to use the NAS. We clarify compatibility, what should be backed up and how a restore would work."
              - "Files whose only copy is on the NAS still need a separate backup. Important data should have another copy kept separately. Damaged or unreadable storage is outside an ordinary setup or transfer job."
