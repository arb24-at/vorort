      content:
        eyebrow: "Wi-Fi & home networks · On site in Berlin"
        title: "Home network setup. Even for one room."
        intro: "A new router to connect, weak Wi-Fi in the bedroom or a desk that keeps dropping offline? We help set up and improve home networks across Berlin. Small jobs are welcome. We check your rooms and existing equipment before recommending changes or planning a larger installation."
        media:
          subject: "private-hero"
          src: "/images/concept-ii/private/P1.png"
          alt: "Illustration of a home with a work area, living room and network connections planned together."
        actions:
          - label: "Tell us what you need"
            target: "contact"
          - label: "Explore the options"
            target: "topics"
    - id: "everyday-situations"
      kind: "recognition"
      recipe: "recognition.situations"
      content:
        eyebrow: "When the connection gets in the way"
        title: "It often starts with one everyday frustration."
        intro: "You may know exactly what stops working, even if you do not know why. These are all useful starting points for a conversation."
        items:
          - title: "The bedroom is one room too far."
            body: "Wi-Fi works beside the router, but a call or stream struggles at the other end of the flat. We can check coverage where you actually use it."
          - title: "The new router is still in its box."
            body: "You need it set up and your usual devices connected again. We look at the incoming connection and what can stay in use."
          - title: "Your desk keeps dropping offline."
            body: "The laptop connects, but work calls are unreliable. We can check the link at the desk, including the dock, adapter and available connection options."
          - title: "The printer or TV will not join in."
            body: "One device is awkward to connect or cannot be reached from the computer. We check its supported connections and how it fits the home network."
          - title: "A move has changed where everything belongs."
            body: "The router, desk and existing outlets no longer line up. We can work through practical positions and routes before you buy more equipment."
    - id: "practical-help"
      kind: "explanation"
      recipe: "explanation.editorial-prose"
      content:
        eyebrow: "Practical help, at the right scale"
        title: "Work with what you have. Change what helps."
        intro: "We start with the rooms and devices you need to connect, then check the router, equipment positions and existing cables. The aim is to agree useful work for your home, whether that is one connection or a broader setup."
        blocks:
          - type: "columns"
            columns:
              - title: "For a specific problem"
                paragraphs:
                  - "We can set up a router, reconnect agreed devices or assess a weak room connection. Better configuration or placement may help; an access point or cable is considered where there is a practical reason for it."
              - title: "For a planned installation"
                paragraphs:
                  - "We can plan Wi-Fi, network outlets and wired connections together, then install and configure what you agree. Existing equipment remains part of the plan where it is suitable. Hardware procurement is optional."
          - type: "prose"
            paragraphs:
              - "You do not need to choose a Mesh system or draw up a network plan before contacting us. We explain the options and their limits in everyday terms."
          - type: "callout"
            tone: "quiet"
            title: "Agree the next step first"
            body: "Work is quoted individually. Any charge for a necessary diagnostic visit is explained before arranging it; extra equipment or work is discussed before proceeding."
    - id: "quick-contact"
      kind: "cta"
      recipe: "cta.quick-contact"
      content:
        eyebrow: "An easy place to start"
        title: "Talk through what you need."
        body: "The first conversation is free. Tell us what is happening and what you already have. We discuss suitable next steps and costs, including any charge for a diagnostic visit, before arranging work."
        callLabel: "Call about your home network"
        enquiryLabel: "Prefer to write?"
        enquiryTarget: "contact"
    - id: "contact"
      kind: "contact"
      recipe: "contact.enquiry-email"
      content:
        title: "Tell us about your connection."
        intro: "A few lines about the room, device or change you have in mind are enough. You do not need to diagnose the problem. We can clarify the details and discuss the next step with you."
        formIntro: "This form prepares a draft in your email app. Review it and choose Send there to complete your enquiry. Nothing is sent directly from this page. * Required fields."
        request: "What would you like help with?"
        requestPlaceholder: "For example: Wi-Fi works in the living room but drops at my desk in the bedroom. I have the provider’s router and live in Neukölln. Please leave out passwords and access codes."
        affectedPlaceholder: "For example a router, bedroom Wi-Fi or a home-office connection"
        emailSubject: "Home network enquiry — Berlin"
    - id: "topics"
      kind: "scope"
      recipe: "scope.topic-index"
      content:
        eyebrow: "Prefer to explore first?"
        title: "Follow the connection through your home."
        intro: "You do not have to choose equipment before getting in touch. If you would like to understand the options first, start with the part of your home network that matters to you. The chapters below explain the choices, what installation involves and where a simpler change may be enough."
        items:
          - title: "Wi-Fi & Mesh"
            body: "Reach the rooms you use without automatically replacing everything."
            target: "wifi-coverage"
            media:
              subject: "wifi"
              src: "/images/concept-ii/private/P2.png"
              alt: "Illustration of two living areas linked by a Wi-Fi access point and a suggested wireless path."
          - title: "Ethernet & cabling"
            body: "Decide where a wired connection would earn its place."
            target: "ethernet-cabling"
            media:
              subject: "cabling-home"
              src: "/images/concept-ii/private/P5.png"
              alt: "Illustration of a network outlet and a neatly routed cable in a home."
          - title: "Your desk & devices"
            body: "Bring the computer, dock and printer into the picture."
            target: "home-office"
            media:
              subject: "home-office"
              src: "/images/concept-ii/private/P3.png"
              alt: "Illustration of a home workstation with a computer and network connection."
          - title: "NAS & shared files"
            body: "Understand shared storage, access and a separate backup."
            target: "nas-storage"
            media:
              subject: "storage-home"
              src: "/images/concept-ii/private/P4.png"
              alt: "Illustration of a compact network storage device shared by several devices."
          - title: "Moving or improving"
            body: "Work with what is there and plan changes in sensible stages."
            target: "network-planning"
            media:
              subject: "upgrade-home"
              src: "/images/concept-ii/private/P6.png"
              alt: "Illustration of a room being updated, with a network outlet planned into the layout."
    - id: "wifi-coverage"
      kind: "explanation"
      recipe: "explanation.editorial-prose"
      content:
        eyebrow: "01 · Wi-Fi & Mesh"
        title: "Plan Wi-Fi around the rooms you use."
        intro: "A signal in the hallway tells you little about a video call at the back of the flat. Wi-Fi setup starts with where you use the connection, which devices need it and what is already in place."
        blocks:
          - type: "prose"
            paragraphs:
              - "Walls, floors, neighbouring networks and the position of the router all affect wireless coverage. We look at the important rooms and check the existing equipment. Sometimes a better position or a different connection is enough; sometimes another access point is useful."
              - "An access point provides Wi-Fi in a particular area. Mesh coordinates several access points as a system. Mesh Wi-Fi setup can link those points wirelessly or by Ethernet cable, so “Mesh” and “wired access point” are not opposing choices. The link back to the router matters as much as the signal near your device."
          - type: "subheading"
            emphasis: "band"
            title: "Three approaches. Different installation trade-offs."
            body: "We compare the options against the property and the places you need to connect, rather than choosing a system before seeing the home."
          - type: "table"
            title: "Ways to improve Wi-Fi coverage"
            columns:
              - "Approach"
              - "Where it can help"
              - "What to check"
            rows:
              - - "Reposition existing equipment"
                - "Nearby rooms with an unhelpfully placed router."
                - "Incoming connection, practical cable reach and obstructions."
              - - "Wireless Mesh nodes or repeaters"
                - "Additional rooms where running a cable is difficult."
                - "Each point needs a useful wireless link back; a dead zone is often a poor location for it."
              - - "Access points with Ethernet links"
                - "Rooms or floors where a cable route is feasible."
                - "Cable route, network ports and a suitable position for each access point; these points may also be part of Mesh."
          - type: "callout"
            tone: "quiet"
            title: "Test where it matters"
            body: "After Wi-Fi installation, we check the agreed rooms and devices with you. Building materials and device capabilities still set limits; no setup can promise the same speed everywhere."
    - id: "ethernet-cabling"
      kind: "explanation"
      recipe: "explanation.connection-path"
      content:
        eyebrow: "02 · Ethernet & network cabling"
        title: "Give the busy connections a cable."
        paragraphs:
          - "Ethernet carries data over a network cable. It can suit a fixed desk, TV, NAS or an access point that would otherwise depend on a wireless link. Home network cabling can be a single useful run; it does not have to mean rewiring every room."
          - "For Ethernet installation, we check where the router or switch sits, where the connection should end and how a cable could get there. Existing routes and outlets may be reusable. A tidy surface-mounted route can sometimes be more practical than opening walls."
        diagramTitle: "From network ports to useful connection points"
        caption: "This overview groups the cable routes: each wired device needs a separate run and network port. Routes, outlets and equipment are agreed for your home."
        source:
          title: "Router or switch"
          body: "One available network port for each agreed wired connection."
        route:
          title: "Cable runs & outlets"
          body: "Separate cable runs to the agreed connection points."
        destinations:
          - title: "Desk or TV"
            body: "A dedicated connection for a fixed device."
          - title: "Wi-Fi access point"
            body: "A cable back to the rest of the network."
          - title: "NAS storage"
            body: "Shared files connected to the home network."
        planning:
          title: "Decide the route before the installation."
          body: "Network cabling involves the property as well as the equipment. We agree the practical details first."
          items:
            - title: "Reuse what is suitable"
              body: "Check existing outlets, routes and ports before adding new ones."
            - title: "Agree the physical work"
              body: "Discuss permissions, visible cable channels and any making-good separately. Electrical wiring is outside this service."
            - title: "Leave useful connection points"
              body: "Choose outlet positions for the furniture and devices you expect to use."
    - id: "home-office"
      kind: "explanation"
      recipe: "explanation.editorial-prose"
      content:
        eyebrow: "03 · Home office & devices"
        title: "Plan the connection all the way to your desk."
        intro: "Home office network setup includes more than the router. A computer, dock, printer and the route between them can each affect what works at the desk."
        blocks:
          - type: "prose"
            paragraphs:
              - "We check how the computer connects, which ports or adapters are available and whether a wired connection is practical. If Wi-Fi is the better fit, the access point position should serve the workspace rather than just the centre of the flat."
          - type: "columns"
            columns:
              - title: "The working connection"
                paragraphs:
                  - "Consider the laptop, dock or adapter together. A nearby Ethernet outlet is only useful if the device can use it."
              - title: "The everyday extras"
                paragraphs:
                  - "Check a network printer and other agreed devices from the computer that actually needs to reach them."
          - type: "callout"
            tone: "quiet"
            title: "Company-managed equipment?"
            body: "Your employer’s IT team may control VPN, security and account settings. We can help with the home connection; changes to managed equipment need their authorisation."
    - id: "nas-storage"
      kind: "explanation"
      recipe: "explanation.editorial-prose"
      content:
        eyebrow: "04 · NAS & shared files"
        title: "A shared place for files. A separate plan for backup."
        intro: "A NAS is a storage device on your home network. It can make photos and documents available to more than one device without leaving one particular computer switched on."
        blocks:
          - type: "prose"
            paragraphs:
              - "NAS setup starts with who needs which files, how much storage is useful and which computers or phones need access. We check compatibility, set up the agreed user accounts and permissions, and test access from the relevant devices. It is an optional part of a home network, not something every household needs."
          - type: "subheading"
            emphasis: "plain"
            title: "Shared storage does not create another copy."
            body: "If the only copy of a file lives on the NAS, it still needs a backup. RAID can help with some drive failures, but it does not independently protect against accidental deletion, theft or damage to the whole device."
          - type: "prose"
            paragraphs:
              - "We plan a separate backup destination and how important files could be restored. Computer backups to the NAS may also be possible, depending on the devices and software. Access from outside the home needs a separate assessment; it is not switched on automatically. Recovering data from damaged or unreadable storage is outside ordinary NAS installation."
    - id: "network-planning"
      kind: "explanation"
      recipe: "explanation.editorial-prose"
      content:
        eyebrow: "05 · Moving & improving"
        title: "Make the next change fit what comes after it."
        intro: "A move or renovation is a useful moment to think about connections. An existing home can also improve one sensible step at a time."
        blocks:
          - type: "columns"
            columns:
              - title: "Before work begins"
                paragraphs:
                  - "Think about desk, TV and access point positions while routes are still accessible. We can help decide where network outlets would be useful."
              - title: "Without a renovation"
                paragraphs:
                  - "Review the current router and connections first. A new route, an extra access point or a better use of existing outlets may address the immediate need."
          - type: "prose"
            paragraphs:
              - "We separate what you need now from what can wait. A staged home network installation can leave useful connection points for later without buying every device at once. Existing equipment stays in the plan where it is suitable."
          - type: "callout"
            tone: "quiet"
            title: "Need equipment too?"
            body: "We can supply agreed hardware if requested. We discuss the choice and cost first, including how it fits the equipment you already own."
    - id: "installation"
      kind: "process"
      recipe: "process.staged-path"
      content:
        eyebrow: "From the first question to handover"
        title: "Agree the work. Then make the connections."
        intro: "The first conversation is free. Whether the job is one router or a wider installation, the scope and costs are discussed before work goes ahead."
        steps:
          - title: "Tell us what you need"
            body: "Describe the room, device or problem in everyday language. Mention your Berlin district and any equipment you already have; a finished network plan is unnecessary."
          - title: "Check & agree"
            body: "We assess the setup and propose suitable work. Any necessary diagnostic visit and its charge are explained beforehand, along with equipment and installation costs."
          - title: "Install & configure"
            body: "We carry out the agreed setup, cabling or configuration. If something additional is needed, we discuss it with you before extending the work."
          - title: "Test & explain"
            body: "We check the agreed connections and areas with you, explain the important settings and make any remaining limitations clear."
    - id: "questions"
      kind: "faq"
      recipe: "faq.editorial-answers"
      content:
        eyebrow: "A few things you may be wondering"
        title: "Questions worth settling before a visit."
        intro: "These practical details can affect the work, particularly in an existing home."
        items:
          - question: "Can you install Ethernet in a lived-in flat?"
            paragraphs:
              - "We check suitable routes and existing outlets first. A surface-mounted cable channel can sometimes provide a useful connection without opening walls. Permissions and any making-good are agreed before work, and electrical wiring is outside this service."
          - question: "Can I keep my provider’s router?"
            paragraphs:
              - "Often it can remain part of the setup. We check its ports, settings and compatibility with the agreed devices before recommending a change. Provider-owned equipment and the incoming connection are considered when planning the work."
          - question: "What will it cost, and when could you visit?"
            paragraphs:
              - "Work is quoted individually because the existing setup, cable routes and scope differ. The first conversation is free; any charge for a necessary diagnostic visit is explained before arranging it. Appointments are agreed individually. Evening or Saturday visits may be possible by agreement."
          - question: "Can you promise strong Wi-Fi in every room?"
            paragraphs:
              - "Coverage depends on the building, neighbouring wireless networks, equipment and the devices themselves. We plan for the agreed locations and test them after setup. Where a wireless link has limits, we explain whether a different position or a cable could help."
          - question: "What if the problem is with my internet provider?"
            paragraphs:
              - "We can help distinguish a problem inside the home network from one on the incoming connection. If the fault is in the provider’s network or line, the provider must handle it. A home-network visit does not repair that infrastructure."
    - id: "final-contact"
      kind: "cta"
      recipe: "cta.quick-contact"
      content:
        eyebrow: "Ready for the next step?"
        title: "Let’s start with your home."
        body: "Tell us which connection needs attention, or what you are planning. Call us, or return to the same enquiry form above. A small job is welcome."
        callLabel: "Discuss your next step"
        enquiryLabel: "Return to the enquiry"
        enquiryTarget: "contact"
