page:
  id: "wifi-home-network-blueprint-pilot"
  locale: "en"
  audience: "private"
  pageType: "service"
  title: "Home network blueprint pilot"
  enquiryPlacement: "early"
  sourceService: "wifi-home-network-en"
relatedServicesBefore: "final-contact"
sections:
  - fromServiceSection: "introduction"
  - id: "everyday-situations"
    kind: "recognition"
    recipe: "recognition.situations"
    content:
      eyebrow: "Does any of this sound familiar?"
      title: "Ordinary problems. Worth sorting out."
      intro: "You do not need a big installation project to ask for help. Start with the connection that gets in your way."
      items:
        - title: "Good Wi-Fi in the hall. Not in the bedroom."
          body: "You want to use the connection where you spend time, rather than move closer to the router."
        - title: "New router. Several devices to reconnect."
          body: "The box has arrived, but the computer, TV or printer still needs to find its way back online."
        - title: "A desk that keeps losing its link."
          body: "You need to understand whether Wi-Fi, a cable or the connections at the desk would be the better fit."
  - id: "quick-contact"
    kind: "cta"
    recipe: "cta.quick-contact"
    content:
      eyebrow: "Start with a conversation"
      title: "A small job is a good reason to call."
      body: "The first conversation is free. Tell us what is happening; we can consider your existing equipment and discuss suitable next steps. Scope and costs are agreed before work, including any charge for a necessary diagnostic visit."
      callLabel: "Call about your home network"
      enquiryLabel: "Prefer to write?"
      enquiryTarget: "contact"
  - id: "contact"
    kind: "contact"
    recipe: "contact.enquiry"
    content:
      title: "Tell us what should work better."
      intro: "One room or a larger plan: a few lines are enough. You do not need to diagnose the problem or choose the equipment first."
      formIntro: "Try the enquiry layout below. Direct delivery is not connected in this preview; use a direct contact link to get in touch. * Required fields."
      request: "What would you like help with?"
      requestPlaceholder: "For example: Wi-Fi works in the living room but drops at my desk in the bedroom. I have the provider’s router and live in Neukölln. Please leave out passwords and access codes."
      affectedPlaceholder: "For example a router, bedroom Wi-Fi or a home-office connection"
  - fromServiceSection: "topics"
  - fromServiceSection: "wifi-coverage"
  - fromServiceSection: "ethernet-cabling"
  - fromServiceSection: "home-office"
  - fromServiceSection: "nas-storage"
  - fromServiceSection: "network-planning"
  - fromServiceSection: "installation"
  - fromServiceSection: "questions"
  - id: "final-contact"
    kind: "cta"
    recipe: "cta.quick-contact"
    content:
      eyebrow: "Your next step"
      title: "Start with the connection you need."
      body: "You can describe one troublesome room or talk through a wider plan. Call us, or return to the enquiry above. There is no need to choose a router, Mesh system or cable layout first."
      callLabel: "Talk about the next step"
      enquiryLabel: "Return to the enquiry"
      enquiryTarget: "contact"
  - id: "site-footer"
    kind: "footer"
    recipe: "footer.site"
    content: {}
