page:
  id: wifi-home-network-concept-ii
  locale: en
  audience: private
  pageType: service
  title: Home Network / Wi-Fi / NAS Concept II
sections:
  - id: hero
    kind: hero
    recipe: hero.banner-art
    content:
      eyebrow: Private customers & home offices · Home network
      title: Home network, Wi‑Fi and NAS setup in Berlin
      intro: >-
        A reliable home network is more than an internet connection. We plan and improve Wi‑Fi, cabling,
        shared storage and device connections around the rooms and routines that matter every day.
      media:
        subject: private-hero
        alt: >-
          Tactile illustrated Berlin home network scene: apartment rooms, home-office desk, Wi‑Fi coverage,
          cable route and NAS in one calm environmental composition.
        src: /images/concept-ii/private/P1.png
      actions:
        - label: Request support
          target: contact
        - label: See what is included
          target: service-scope
      highlights:
        - Wi‑Fi & Mesh coverage
        - Home-office connectivity
        - NAS & shared storage
        - Ethernet & cable routes
  - id: service-scope
    kind: scope
    recipe: scope.art-panels
    content:
      eyebrow: At a glance
      title: The parts of a home network we can help bring together
      intro: >-
        The page should answer the scope question almost instantly. This horizontal visual ribbon stays
        concise; deeper explanation comes later.
      items:
        - title: Wi‑Fi & Mesh coverage
          media:
            subject: wifi
            src: /images/concept-ii/private/P2.png
        - title: Home-office connectivity
          media:
            subject: home-office
            src: /images/concept-ii/private/P3.png
        - title: NAS & shared storage
          media:
            subject: storage-home
            src: /images/concept-ii/private/P4.png
        - title: Ethernet & cable routes
          media:
            subject: cabling-home
            src: /images/concept-ii/private/P5.png
        - title: Moves, renovation & upgrades
          media:
            subject: upgrade-home
            src: /images/concept-ii/private/P6.png
  - id: network-environment
    kind: explanation
    recipe: explanation.art-gallery
    content:
      eyebrow: The network as an environment
      title: A home network works best when the pieces are planned together
      intro: >-
        These full-art panels are where the final illustration system should do most of the storytelling:
        recognisable rooms and objects, just enough technical structure, and very little reading burden.
      items:
        - eyebrow: Whole-home connectivity
          title: Plan the network around rooms and routines, not a router box
          body: >-
            Coverage, cable routes, device locations and home-office needs are considered together so the
            result makes sense in the actual home.
          media:
            subject: wifi
        - eyebrow: Shared storage
          title: Give files a sensible home
          body: >-
            A NAS can provide useful shared storage for photos, media or work data, with backup treated as a
            separate requirement rather than assumed.
          media:
            subject: storage-home
        - eyebrow: Physical setup
          title: Use cable where reliability matters
          body: >-
            Ethernet, wired access points and better router placement can reduce the pressure on wireless
            coverage and keep stationary equipment dependable.
          media:
            subject: cabling-home
  - id: situations
    kind: recognition
    recipe: recognition.situations
    content:
      eyebrow: Recognisable situations
      title: You can start with what is happening, not with a diagnosis
      intro: >-
        Private customers should not need to think like network engineers before contacting us. The page can
        recognise the experience first and introduce the technical language later.
      items:
        - title: The Wi‑Fi is fine in one room and frustrating in another
          body: >-
            You do not need to know whether the answer is Mesh, a wired access point, a different location or
            something else. Start with what you actually notice.
        - title: The home office now needs more than a basic internet connection
          body: >-
            Reliable calls, work devices, printers and storage can make the network part of everyday work
            rather than background household equipment.
        - title: The setup has become a collection of repeaters, cables and separate boxes
          body: A planned refresh can simplify the physical layout and make it clearer what each part is doing.
        - title: You are moving, renovating or finally planning the network properly
          body: >-
            That is often the best moment to think about outlets, cable routes, Wi‑Fi placement and shared
            storage before furniture and finishes make changes harder.
  - id: process
    kind: process
    recipe: process.staged-path
    content:
      eyebrow: How we work
      title: From a frustrating situation to a network that makes sense
      intro: >-
        Technical depth increases here, after the visitor already understands the service scope. The process
        remains short and practical.
      steps:
        - title: Tell us what you notice
          body: >-
            A room with poor coverage, unstable calls, central-storage needs or a messy existing setup is
            enough to start.
        - title: Understand the home
          body: >-
            Rooms, walls, existing connections, device locations and the way the home office is used shape the
            practical options.
        - title: Agree the useful changes
          body: >-
            We keep the scope tied to the real problem rather than replacing equipment simply because
            something newer exists.
        - title: Build, test and explain
          body: >-
            The finished network should be more reliable and more understandable, with an agreed handover
            rather than a mystery box.
  - id: outcome
    kind: outcome
    recipe: outcome.scope-proof
    content:
      eyebrow: Useful outcome
      title: The goal is not more hardware. It is a clearer network foundation.
      body: >-
        Reliable connections where they matter, cable where it makes sense, useful shared storage and a setup
        that is easier to understand and extend later.
      media:
        subject: wifi
        alt: Outcome artwork placeholder
      includedHeading: Often included
      included:
        - Wi‑Fi planning
        - Mesh and wired access points
        - Ethernet cabling
        - Network outlets
        - Router placement
        - NAS and shared storage
        - Home-office connectivity
        - Selected printers and connected devices
        - Testing
        - Understandable handover
      boundariesHeading: Important boundaries
      boundaries:
        - No blanket speed guarantee
        - No whole-property coverage guarantee without assessment
        - ISP line faults remain outside the home network
        - NAS does not automatically mean backup
        - No guaranteed data recovery
        - Never send passwords or recovery codes through the enquiry
  - id: questions
    kind: faq
    recipe: faq.accordion
    content:
      eyebrow: Useful answers
      title: Useful answers about home network work
      items:
        - question: Can you improve Wi‑Fi without replacing everything?
          answer: >-
            Often, yes. The useful answer depends on the property, existing equipment, cable options and where
            reliable coverage is actually needed.
        - question: Can you install Ethernet and wired access points?
          answer: >-
            Yes, where the property and agreed scope make that practical. Cable routes and installation
            details are assessed for the real space rather than promised generically.
        - question: Can you set up NAS and backup?
          answer: >-
            We can set up NAS and shared storage. A NAS is not automatically a backup, so backup requirements
            should be planned separately and explained clearly.
        - question: Can printers, TVs and other devices be connected too?
          answer: >-
            Suitable networked devices can be integrated when they fit the project. Compatibility and vendor
            limitations still apply.
        - question: Can you guarantee strong Wi‑Fi in every room?
          answer: >-
            No. Coverage depends on the property, interference, materials and equipment. We can assess and
            design for the real environment, but we do not publish blanket coverage or speed guarantees.
  - id: contact
    kind: contact
    recipe: contact.enquiry
    content: {}
