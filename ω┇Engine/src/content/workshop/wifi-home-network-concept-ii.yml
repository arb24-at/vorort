  title: Home Network / Wi-Fi / NAS Concept II
sections:
  - id: hero
    kind: hero
    recipe: hero.editorial-art
    content:
      eyebrow: At home in Berlin · Network installation & support
      title: Home network, Wi-Fi and NAS setup in Berlin
      intro: >-
        Better connections for the rooms you live and work in. We plan, install and improve home networks —
        bringing Wi-Fi, Ethernet, shared storage and everyday devices together around your home.
      media:
        subject: private-hero
        src: /images/concept-ii/private/P1.png
        alt: An illustrated Berlin apartment with a work desk, living room, wireless connections and a cable route to shared storage.
      actions:
        - label: Discuss your network
          target: contact
        - label: Explore the service
          target: service-scope
  - id: service-scope
    kind: scope
    recipe: scope.topic-index
    content:
      eyebrow: Find your starting point
      title: Explore home network services
      intro: >-
        A weak signal, a new home office or a place for shared files: start with what matters to you.
        Each topic below explains the options and the work we can help with.
      items:
        - title: Wi-Fi & Mesh
          body: Coverage where you need it, with equipment placed for the real home.
          target: wifi-coverage
          media:
            subject: wifi
            src: /images/concept-ii/private/P2.png
            alt: Wireless connections linking a home-office area and living space.
        - title: Ethernet & cabling
          body: Cable routes, network outlets and connections for fixed devices.
          target: ethernet-cabling
          media:
            subject: cabling-home
            src: /images/concept-ii/private/P5.png
            alt: An orange cable route connecting a home-office desk through a wall outlet.
        - title: Home office & devices
          body: Work calls, printers and everyday equipment on the same network.
          target: home-office
          media:
            subject: home-office
            src: /images/concept-ii/private/P3.png
            alt: A connected workstation in a warm residential interior.
        - title: NAS & shared storage
          body: A central home for files, with user access and backup planned properly.
          target: nas-storage
          media:
            subject: storage-home
            src: /images/concept-ii/private/P4.png
            alt: A compact NAS sharing a connection with a laptop, tablet and television.
        - title: Planning & upgrades
          body: A new home, an older setup or a network that has become hard to follow.
          target: network-planning
          media:
            subject: upgrade-home
            src: /images/concept-ii/private/P6.png
            alt: A home in transition with a desk, moving boxes and network planning details.
  - id: wifi-coverage
    kind: explanation
    recipe: explanation.options-guide
    content:
      eyebrow: 01 / Wireless coverage
      title: Wi-Fi coverage, Mesh and access points
      paragraphs:
        - >-
          The Wi-Fi works beside the router, but calls break up at the desk or a bedroom barely connects.
          Before adding another box, it helps to understand the layout: where the router sits, what lies
          between rooms and which devices need a dependable connection.
        - >-
          We assess the existing setup and plan suitable positions for the router, Mesh units or access
          points. Walls, other wireless networks, available Ethernet connections and the way you use each
          room all influence the approach. A stronger router is not automatically the answer, and useful
          existing equipment does not need to be replaced simply because something newer is available.
      media:
        subject: wifi
        src: /images/concept-ii/private/P2.png
        alt: A home-office desk and living area connected by subtle wireless signal paths.
      caption: Plan coverage around the rooms and devices that need it.
      comparisonTitle: Three approaches, chosen around your home
      fitLabel: Where it can help
      considerationLabel: What to consider
      options:
        - title: Reposition & configure
          fit: An existing router or access point is poorly placed, or the setup needs adjustment.
          consideration: The internet entry point, walls and available connections limit where equipment can go.
        - title: Mesh Wi-Fi
          fit: Several areas need wireless coverage and a coordinated set of units suits the property.
          consideration: Placement and the connection between units matter. Adding a node in a dead zone is not a substitute for planning.
        - title: Wired access points
          fit: Coverage is needed away from the router and an Ethernet route exists or can be installed.
          consideration: Each access point needs a suitable position and a physical connection back into the network.
      note:
        title: Coverage is checked in the real space
        body: >-
          We test the agreed rooms and devices after the work. Building materials, interference and the
          devices themselves affect performance, so we do not promise a universal Wi-Fi speed or coverage guarantee.
  - id: wifi-planning-notes
    kind: explanation
    recipe: explanation.editorial-prose
    content:
      eyebrow: Wireless planning notes
      title: What actually shapes Wi-Fi coverage
      intro: >-
        Coverage is not a property of the router alone. The rooms, building materials, wired routes and the
        devices you care about all change what a useful wireless plan looks like.
      blocks:
        - type: prose
          paragraphs:
            - >-
              A signal that looks strong in one room can become unreliable after several walls, around dense
              building materials or where neighbouring networks compete for the same space. The useful question
              is not simply how far a router can reach, but whether the devices that matter can work reliably
              where you actually use them.
            - >-
              That is why planning starts with the home rather than a shopping list. We look at the internet
              entry point, the current equipment, the rooms that matter and the practical routes available if a
              wired connection would improve the result.
        - type: callout
          tone: quiet
          title: A floor plan is useful, but the real rooms still decide the result
          body: >-
            Plans help identify likely routes and equipment positions. Final placement still depends on the actual
            walls, furniture, sockets and devices in the home, so the design is checked against the real space.
        - type: subheading
          emphasis: band
          title: Start with the building, not the box
          body: A good plan joins the physical layout to the way the network is actually used.
        - type: columns
          columns:
            - title: The building
              paragraphs:
                - >-
                  Walls, room position, doorways and the location of the internet entry point limit where wireless
                  equipment can work well. Existing Ethernet can open up stronger options for distant rooms.
            - title: The way you use it
              paragraphs:
                - >-
                  A fixed desk, television or NAS has different needs from a phone moving around the flat. The
                  important devices and rooms help decide where reliability matters most.
        - type: callout
          tone: solid
          title: More hardware is not the same as more coverage
          body: >-
            Adding another repeater or Mesh node can help, but only when its position and connection make sense.
            Extra equipment placed into the same weak area can simply repeat the original problem.
        - type: media
          placement: right
          media:
            subject: home-office
            src: /images/concept-ii/private/P3.png
            alt: A connected workstation in a residential room, showing why the exact place of use matters to network planning.
        - type: subheading
          title: Where a cable changes the options
          body: Ethernet does not replace Wi-Fi; it can give important fixed devices or access points a dependable path back to the network.
        - type: prose
          paragraphs:
            - >-
              A wired access point can be useful when coverage is needed well away from the router and a practical
              cable route exists. The same connection can also serve a workstation, television or NAS directly,
              reducing the number of important devices competing for wireless capacity.
        - type: media
          placement: left
          media:
            subject: cabling-home
            src: /images/concept-ii/private/P5.png
            alt: A planned Ethernet route reaching a home-office desk through a wall outlet.
        - type: table
          title: What we look at before choosing equipment
          columns: [Check, Why it matters, What it can change]
          rows:
            - [Router position, The starting point shapes the whole wireless layout., Repositioning may solve more than buying a stronger router.]
            - [Walls and room layout, Signal loss is different across real rooms and materials., Access-point or Mesh positions may need to move.]
            - [Existing cable routes, Ethernet can provide a reliable path to distant rooms., A wired access point or direct device connection may become practical.]
            - [Important devices, Fixed and mobile devices do not all need the same connection., The plan can prioritise the rooms and equipment that matter.]
        - type: callout
          tone: outline
          title: The result is a plan, not a blanket guarantee
          body: >-
            We test the agreed rooms and devices in the real space. Building materials, interference and client
            devices still affect performance, so the useful promise is an assessed and tested setup rather than a
            universal speed or coverage claim.
  - id: ethernet-cabling
    kind: explanation
    recipe: explanation.connection-path
    content:
      eyebrow: 02 / Physical connections
      title: Ethernet installation and cable routes
      paragraphs:
        - >-
          Wi-Fi is convenient for moving around the home. A fixed desk, television, NAS or access point can
          also benefit from a wired connection. Ethernet gives those devices a physical route into the
          network and reduces their reliance on a wireless signal travelling through the home.
        - >-
          We can plan and install agreed network cabling, outlets and connection points in apartments and
          houses. Existing routes, furniture, equipment positions and the work the property allows are
          considered together. Moves and renovations are useful moments to plan these connections before
          finishes and furniture make access more difficult.
      diagramTitle: From the router to the places that need a connection
      source:
        title: Router / network switch
        body: The starting point for the wired connections in your home.
      route:
        title: Cable route & outlet
        body: A practical, agreed path through the property.
      destinations:
        - title: Home-office desk
          body: A wired connection for a stationary work device.
        - title: Wi-Fi access point
          body: Wireless coverage from a point connected by Ethernet.
        - title: NAS or television
          body: A fixed connection for shared files or everyday media.
      caption: >-
        A simplified relationship, not a wiring plan: destinations use their own suitable connections.
        The number of cables, outlets and switch ports is agreed for your setup.
      note:
        title: Agree the installation details first
        body: >-
          We assess possible routes and discuss access, visible cabling, outlets and any associated making-good
          before the installation. The physical work is scoped for the actual property rather than promised as a standard package.
  - id: home-office
    kind: explanation
    recipe: explanation.editorial-media
    content:
      eyebrow: 03 / Everyday connections
      title: Reliable home-office and device connections
      paragraphs:
        - >-
          A work area needs more than a signal indicator. Video calls, large files, printers and shared
          storage all depend on the connection at the desk. We consider the home office as part of the
          whole network, including whether Wi-Fi, a wired connection or a nearby access point is the
          sensible foundation.
        - >-
          Computers, compatible printers, Smart TVs and other networked devices can be connected as part
          of the agreed work. We look at how they need to reach each other, where they are used and which
          connections should be tested at handover. The aim is a setup you can understand, rather than a
          growing collection of separate fixes.
      media:
        subject: home-office
        src: /images/concept-ii/private/P3.png
        alt: A home-office workstation connected to the network within a lived-in apartment.
      note:
        title: Device and workplace boundaries
        body: >-
          Compatibility depends on the manufacturer, model and software. Employer-managed devices or VPN
          settings may need coordination with your workplace IT team. Broader smart-home installation is a
          separate project; this service focuses on the network and device connectivity.
  - id: nas-storage
    kind: explanation
    recipe: explanation.editorial-media
    content:
      eyebrow: 04 / Shared storage
      title: NAS setup, shared files and backup planning
      paragraphs:
        - >-
          A NAS is a storage device connected to your network. It can give photos, documents, media and
          work files a central place that suitable devices in the home can access. The starting point is
          what should be stored, who needs access and how those files will be used — not simply how many
          drive bays a box has.
        - >-
          We can recommend or supply suitable NAS hardware, configure shared storage and user access,
          and connect the agreed computers or other compatible devices. The NAS location and its network
          connection are part of the same plan as the Wi-Fi, cabling and home office.
        - >-
          Backup needs a separate conversation. Decide which files need another copy, where that copy
          should live and how the backup process will be checked. We discuss a suitable structure and
          explain the agreed setup at handover, so shared storage and backup have clear, distinct roles.
      media:
        subject: storage-home
        src: /images/concept-ii/private/P4.png
        alt: A four-bay NAS on a shelf with connections to a laptop, tablet and television.
      note:
        title: A NAS is not automatically a backup
        tone: solid
        body: >-
          If a file only exists on the NAS, moving it there has not created an independent backup. Shared
          storage also does not guarantee data recovery. Damaged or unreadable media needs a separately assessed approach.
  - id: network-planning
    kind: explanation
    recipe: explanation.editorial-media
    content:
      eyebrow: 05 / New and existing homes
      title: Home network planning, upgrades and troubleshooting
      paragraphs:
        - >-
          A new apartment, a renovation or a change in how you work can be a good reason to plan the
          network from the beginning. We consider room layout, important devices, existing outlets,
          possible cable routes and storage requirements before proposing equipment. Optional hardware
          supply can be included once the useful changes are clear.
        - >-
          An existing network may need a more focused improvement. If the setup has grown into several
          repeaters, routers and loose cables, we review how the parts connect, check the relevant router
          and network configuration, and identify what can usefully stay. Tell us where the problem
          happens and what you need to work; you do not need to arrive with a technical diagnosis.
        - >-
          Troubleshooting also means separating the home network from the internet connection that
          serves it. We can help assess whether a problem is likely within the home or beyond it.
          External line faults and provider infrastructure remain the internet provider's responsibility.
      media:
        subject: upgrade-home
        src: /images/concept-ii/private/P6.png
        alt: A residential workspace during a move, with boxes and plans for future connections.
  - id: process
    kind: process
    recipe: process.staged-path
    content:
      eyebrow: On-site work in Berlin
      title: How home network installation works
      intro: >-
        Practical IT experience since 2008 informs the work. The initial conversation is free; projects
        are quoted individually. If a paid diagnostic visit is needed, we explain it before arranging it.
      steps:
        - title: Understand your home
          body: >-
            Start with the important rooms, devices and symptoms. We review the property, existing equipment,
            connections and intended use.
        - title: Agree the scope
          body: >-
            We explain the practical options, equipment and installation work. Costs and any extra work
            are agreed before proceeding.
        - title: Install & configure
          body: >-
            We install the agreed cabling and equipment, configure the network and storage, and connect
            the devices included in the project.
        - title: Test & explain
          body: >-
            We check the agreed rooms, wired and wireless connections and storage access, then explain
            the essential setup in plain language.
  - id: questions-editorial
    kind: faq
    recipe: faq.editorial-answers
    content:
      eyebrow: Questions, answered properly
      title: Home-network questions deserve more than a one-line answer
      intro: >-
        Some decisions shape the whole network, so the useful answer is rarely just yes or no.
        These are a few of the questions we would rather explain openly before you get in touch.
      items:
        - question: Can you improve my network without replacing everything?
          paragraphs:
            - >-
              Often, yes. We start by looking at what is already there: the router and access points,
              where they sit, how the rooms are connected, and which devices actually have a problem.
              Useful equipment does not need to be replaced simply because something newer exists.
            - >-
              Sometimes the better fix is a change of position, configuration or cabling. If hardware
              really is the limiting factor, we explain why and agree the replacement as part of the
              project rather than treating a full refresh as the default answer.
        - question: Is Mesh always better than a repeater or a wired access point?
          paragraphs:
            - >-
              No. Mesh can be a practical way to cover several areas with a coordinated set of units,
              but placement and the connection between those units still matter. Putting another node
              directly into a dead zone does not remove the reason the signal is weak there.
            - >-
              Where Ethernet already exists, or can be installed sensibly, a wired access point may be
              the stronger foundation for a distant room. The right choice depends on the property, the
              existing equipment and the places where a dependable connection matters.
          media:
            subject: wifi
            src: /images/concept-ii/private/P2.png
            alt: A home-office desk and living area connected by subtle wireless signal paths.
          caption: The layout of the home matters more than the label on the Wi-Fi box.
        - question: Can Ethernet be installed in an existing apartment?
          paragraphs:
            - >-
              Yes, where a practical route and the necessary access can be agreed. We look at where the
              router or switch sits, which rooms need a fixed connection, and whether existing routes,
              visible cabling or new outlets make sense for the property.
            - >-
              Installation details are discussed before work starts, including access and any associated
              making-good. The route is planned for the actual apartment rather than promised as a standard
              package that fits every building.
          media:
            subject: cabling-home
            src: /images/concept-ii/private/P5.png
            alt: An orange cable route connecting a home-office desk through a wall outlet.
          caption: A useful cable route is planned around the real rooms, furniture and access available.
        - question: Can the NAS also be used for backups?
          paragraphs:
            - >-
              It can be part of a backup workflow, but a NAS is not automatically a complete backup
              strategy. Shared storage and backup solve related but different problems: one makes files
              available, while the other gives important data another recoverable copy.
            - >-
              We can discuss what needs another copy, where that copy should live and how the agreed
              process will be checked. No storage arrangement can guarantee recovery from every failure,
              and damaged or unreadable media needs a separately assessed approach.
          media:
            subject: storage-home
            src: /images/concept-ii/private/P4.png
            alt: A compact NAS sharing a connection with a laptop, tablet and television.
          caption: Shared storage and backup can work together, but they are not the same thing.
        - question: Can you guarantee strong Wi-Fi in every room?
          paragraphs:
            - >-
              We do not give blanket coverage or speed guarantees. Walls, neighbouring networks, the
              available cable routes and the client devices themselves all affect what is achievable in
              a particular room.
            - >-
              We assess the home, plan suitable measures and test the rooms and devices agreed for the
              project. That gives you a result checked in the real space rather than a generic promise
              based on equipment specifications alone.
        - question: What if the internet provider's line is faulty?
          paragraphs:
            - >-
              A home-network problem and an internet-line problem can feel identical from the desk. We can
              help separate the two by checking the relevant local network, router and connections and by
              identifying whether the fault appears to sit inside or beyond the home.
            - >-
              Faults in the external connection or provider infrastructure ultimately need to be resolved
              by the internet provider. The useful outcome is knowing which side of that boundary needs
              attention instead of repeatedly changing equipment inside the home.
  - id: questions
    kind: faq
    recipe: faq.accordion
    content:
      eyebrow: Before you get in touch
      title: Home-network questions
      items:
        - question: Can you improve my network without replacing everything?
          answer: >-
            Often, yes. We review existing equipment, placement, settings and cable options before recommending
            changes. The aim is to solve the actual problem and keep useful equipment where it fits the plan.
        - question: Can you supply the network and NAS hardware?
          answer: >-
            Yes, suitable equipment can be recommended and supplied as part of the agreed project. We first
            clarify the rooms, devices, storage needs and connections so purchases support the intended result.
        - question: Can Ethernet be installed in an existing apartment?
          answer: >-
            Yes, where a practical route and the necessary access can be agreed. We assess outlets, cable
            routes and installation details for the property. Any associated making-good is discussed in
            advance rather than assumed to be included.
        - question: Is Mesh always better than a repeater or wired access point?
          answer: >-
            No single approach fits every home. Layout, the existing equipment and the connection between
            wireless units all matter. Where cabling is available, a wired access point may be a useful
            option. We assess the property before recommending an approach.
        - question: Can the NAS also be used for backups?
          answer: >-
            A NAS can be part of a backup workflow, but it is not automatically a complete backup strategy.
            We discuss which data needs another copy, where that copy belongs and how the agreed backup
            process will be checked. There is no guaranteed recovery of lost or damaged data.
        - question: Can printers, televisions and smart-home devices be included?
          answer: >-
            Compatible networked devices can be included in the agreed scope. Available features depend on
            the device and its ecosystem. This page covers their network connection; broader smart-home
            installation is a separately scoped project.
        - question: Can you guarantee strong Wi-Fi in every room?
          answer: >-
            We do not give blanket coverage or speed guarantees. Walls, interference, available cable routes
            and client devices affect the result. We assess the home, plan suitable measures and test the
            areas agreed for the work.
        - question: What if the internet provider's line is faulty?
          answer: >-
            We can help assess whether the problem is likely in the home network or outside it. Faults in the
            external connection or provider infrastructure ultimately need to be resolved by the internet provider.
  - id: contact
    kind: contact
    recipe: contact.enquiry
    content:
      title: Tell us about your home network
      intro: >-
        Planning something new or improving what is already there? Tell us the important rooms, the devices
        you use and what you would like to work better. A short description is enough to start.
      formIntro: This form opens your email app with your details so you can review and send your enquiry.
      affectedPlaceholder: For example Wi-Fi coverage, Ethernet, a home office or NAS
      request: What does your home network need to do?
      requestPlaceholder: Describe the rooms, existing connections or symptoms, and what you would like to improve.
